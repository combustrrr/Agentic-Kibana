# ============================================================
# CodeQL Configuration
# Kavach-AgenticSOC — Code Intelligence System
# ============================================================

# Path to a YAML-format config file that customizes the CodeQL CLI.
# Reference: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/customizing-code-scanning-configuration

# Use the default CodeQL query suite plus security-extended queries
queries:
  - uses: security-and-quality
  - uses: security-extended

# Paths to include in the analysis
paths:
  - backend/
  - webui/src/

# Paths to exclude (tests, canary, build artifacts)
paths-ignore:
  - tests/security_canary/
  - backend/.venv/
  - webui/node_modules/
  - webui/dist/

# Additional search paths for custom queries
# (custom queries can be added here in the future)
# searches:
#   - .github/codeql/custom-queries/
