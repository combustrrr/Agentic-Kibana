# ============================================================
# Workflow 6: Canary Coverage Validation
# Kavach-AgenticSOC Code Intelligence System
#
# This workflow is the INTEGRATION TEST for the entire tool web.
# It runs all scanners against the deliberately-vulnerable canary
# test suite and verifies every expected vulnerability is caught.
#
# Runs: Weekly (Sunday) + after any tool config change
# Fails: If any expected vulnerability is NOT detected
# ============================================================

name: Canary Coverage Validation

on:
  workflow_dispatch:
  # DORMANT: Activate after Phase 2 testing (see docs/code-analysis/README.md)
  # To activate, uncomment the triggers below:
  # schedule:
  #   - cron: "0 5 * * 0"    # Sunday 05:00 UTC
  # push:
  #   paths:
  #     - ".github/semgrep-rules/**"
  #     - "backend/pyproject.toml"
  #     - ".gitleaks.toml"
  #     - ".github/workflows/02-security-sast.yml"
  #     - ".github/workflows/03-dependency-security.yml"
  #     - "tests/security_canary/**"
permissions:
  contents: read

jobs:
  canary-scan:
    name:  Scan Canary Suite with All Tools
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .ci/requirements.txt

      - name: Install tools
        run: |
          python -m pip install --requirement .ci/requirements.txt

      - name: Run Semgrep on canary suite
        run: |
          semgrep \
            --config=.github/semgrep-rules/ \
            --config=p/python \
            --config=p/owasp-top-ten \
            --config=p/jwt \
            --json \
            --output=canary-results-semgrep.json \
            tests/security_canary/ || true

      - name: Run Bandit on canary suite
        run: |
          bandit \
            -r tests/security_canary/python/ \
            --format json \
            --output canary-results-bandit.json \
            --exit-zero || true

      - name: Run Ruff on canary suite
        run: |
          ruff check tests/security_canary/ \
            --output-format=json \
            --exit-zero \
            > canary-results-ruff.json || true

      - name: Run Gitleaks on canary suite
        run: |
          mkdir -p canary-gitleaks-input/canary/python
          cp tests/security_canary/python/hardcoded_secret.py canary-gitleaks-input/canary/python/
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect \
            --source /repo/canary-gitleaks-input \
            --config /repo/.gitleaks.toml \
            --no-git \
            --report-format=sarif \
            --report-path /repo/canary-results-gitleaks.sarif \
            --exit-code 0 || true

      - name: Run OSV-Scanner on vulnerable canary dependencies
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=tests/security_canary/requirements-vulnerable.txt
            --format=sarif
            --output=canary-results-osv.sarif

      - name: Run Hadolint on insecure canary Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: tests/security_canary/Dockerfile.insecure
          format: sarif
          output-file: canary-results-hadolint.sarif
          no-fail: true

      - name: Collect all canary scan outputs
        run: |
          mkdir -p canary-scan-results
          cp canary-results-semgrep.json canary-scan-results/ 2>/dev/null || true
          cp canary-results-bandit.json canary-scan-results/ 2>/dev/null || true
          cp canary-results-ruff.json canary-scan-results/ 2>/dev/null || true
          cp canary-results-gitleaks.sarif canary-scan-results/ 2>/dev/null || true
          cp canary-results-osv.sarif canary-scan-results/ 2>/dev/null || true
          cp canary-results-hadolint.sarif canary-scan-results/ 2>/dev/null || true

      - name: Normalize canary findings
        run: |
          python scripts/code_analysis/normalizer.py \
            --input-dir canary-scan-results \
            --output-dir canary-normalized \
            --verbose

      - name: Validate coverage — integration test
        run: |
          python scripts/code_analysis/validate_canary.py \
            --findings-dir canary-normalized \
            --verbose
        # This step FAILS if any expected vulnerability is missed
        # That failure means the tool web has a dead spot

      - name: Upload canary results (for debugging)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-validation-results
          path: |
            canary-scan-results/
            canary-normalized/

      - name: Post coverage summary
        if: always()
        run: |
          echo "## 🛡️ Canary Coverage Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f canary-normalized/deduplicated-findings.json ]; then
            COUNT=$(python -c "import json; d=json.load(open('canary-normalized/deduplicated-findings.json')); print(len(d))")
            echo "- **Total canary findings (deduplicated):** $COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Run date:** $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
