# ============================================================
# Workflow 7: API Fuzzing & Property-Based Testing
# Agentic SOC external code-analysis service
#
# Runs: Weekly (Saturday) + on PRs modifying FastAPI endpoints
# Tool: Schemathesis (OpenAPI schema fuzzer)
# Goal: Achieve zero-fault tolerance by crashing the API
# ============================================================

name: API Fuzzing & Reliability

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 6"    # isolated default-branch DAST, Saturday 04:17 UTC
  # Pull-request execution remains disabled: DAST executes application code and must
  # not elevate untrusted fork changes merely to gain earlier feedback.
  # pull_request:
  #   paths:
  #     - "backend/app/api/**"
  #     - "backend/app/models.py"
  #     - "backend/app/state.py"

permissions:
  contents: read

jobs:
  schemathesis-fuzz:
    name:  Schemathesis API Fuzzer
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kavach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies & Schemathesis
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install "schemathesis==3.39.16" "httpx==0.27.2"

      - name: Start FastAPI Backend in Background
        run: |
          cd backend
          TLSOC_AUTH_ENABLED=false uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 15
          curl -f http://localhost:8000/openapi.json > schema.json || exit 1

      - name: Run API Fuzzing (Schemathesis)
        id: schemathesis
        run: |
          cd backend
          # Limit to 10 minutes to prevent infinite CI hang
          set +e
          timeout 600 schemathesis run schema.json \
            --experimental=openapi-3.1 \
            --base-url http://localhost:8000 \
            --checks all \
            --max-response-time 5000 \
            --hypothesis-max-examples 250 \
            --junit-xml=../fuzzing-results.xml \
            --report=../schemathesis-report.tar.gz
          scan_exit=$?
          set -e
          # Exit 1 represents reproducible API findings. Timeout or execution/config
          # failures are operational failures and must not be presented as findings.
          # A real scan always finalizes a non-empty JUnit document.
          if [[ ! -s ../fuzzing-results.xml ]]; then
            echo "Schemathesis did not produce a valid JUnit report (exit $scan_exit)." >&2
            exit 2
          fi
          [[ "$scan_exit" -le 1 ]] || exit "$scan_exit"

      - name: Upload Fuzzing Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schemathesis-report
          path: |
            fuzzing-results.xml
            schemathesis-report.tar.gz
            backend/schema.json
          if-no-files-found: error

      - name: Parse Results for Aggregation
        if: always()
        run: |
          # Normalize any 500 crashes into our canonical finding format
          python scripts/code_analysis/normalizer.py \
            --input-dir . \
            --output-dir fuzzing-normalized \
            --verbose

      - name: Upload Normalized Findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzzing-findings
          path: fuzzing-normalized/
          if-no-files-found: error

  atheris-state-machine:
    name: Atheris (Bounded Decision-State Fuzzing)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact workflow target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install bounded fuzz target
        shell: bash
        run: |
          set -euo pipefail
          pip install -r backend/requirements.txt "atheris==3.0.0"

      - name: Run deterministic case-decision fuzz campaign
        id: atheris
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fuzz-corpus fuzz-crashes
          printf '\x00\xff\x32\x01' > fuzz-corpus/seed-false-positive
          printf '\x01\xff\x64\x02' > fuzz-corpus/seed-true-positive
          cd backend
          python ../tests/security_canary/fuzzing/atheris_state_fuzzer.py \
            -runs=25000 -max_len=4096 -timeout=5 \
            -artifact_prefix=../fuzz-crashes/ ../fuzz-corpus
          cd ..
          jq -n '{schema_version:"1",scanner_family:"Atheris",status:"COMPLETED_OPTIONAL",reason:"25,000 bounded inputs executed against deterministic case decision logic",finding_count:0,observation_count:0}' \
            > atheris-status.json

      - name: Record Atheris operational failure
        if: failure() && steps.atheris.outcome == 'failure'
        shell: bash
        run: |
          jq -n '{schema_version:"1",scanner_family:"Atheris",status:"OPERATIONAL_FAILURE",reason:"The bounded Atheris campaign did not complete; inspect the job log and retained crash input.",finding_count:0,observation_count:0}' \
            > atheris-status.json

      - name: Retain Atheris campaign evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atheris-state-fuzzing
          path: |
            atheris-status.json
            fuzz-crashes/
          if-no-files-found: warn
