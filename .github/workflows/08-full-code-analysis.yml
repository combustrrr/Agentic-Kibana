name: Full Code Analysis (Manual)
run-name: Analyze branch · ${{ inputs.scan_branch || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      scan_branch:
        description: "Fork branch to scan; blank uses the branch selected in Run workflow"
        required: false
        type: string

# One operator action pins a branch head, runs the four read-only scanner groups,
# waits for them, and builds the exact-commit dashboard.
permissions:
  actions: write
  contents: read

concurrency:
  group: manual-code-analysis-${{ inputs.scan_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Scan branch head and build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # This orchestration job intentionally does not check out source. Give gh an
    # explicit repository so workflow/run commands never depend on local .git state.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve and validate the selected fork branch
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BRANCH: ${{ inputs.scan_branch }}
          SELECTED_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          branch="${REQUESTED_BRANCH:-$SELECTED_REF}"
          if [[ -z "$branch" || "$branch" == refs/* || "$branch" == *$'\n'* || "$branch" == *$'\r'* ]]; then
            echo "Invalid branch name" >&2
            exit 1
          fi
          encoded="$(jq -rn --arg value "$branch" '$value|@uri')"
          payload="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded}")"
          sha="$(jq -r '.commit.sha // empty' <<<"$payload")"
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The selected branch has no valid head commit" >&2
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"

      - name: Dispatch all required full-codebase scanners
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_BRANCH: ${{ steps.target.outputs.branch }}
          SCAN_SHA: ${{ steps.target.outputs.sha }}
          WORKFLOW_REF: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          : > scanner-runs.tsv
          {
            echo "## Full code analysis"
            echo
            echo "- Branch: \`$SCAN_BRANCH\`"
            echo "- Locked head commit: \`$SCAN_SHA\`"
            echo "- Mode: read-only security and quality diagnosis"
            echo
            echo "### Scanner runs"
          } > manual-analysis-summary.md
          for workflow in \
            01-code-quality.yml \
            02-security-sast.yml \
            03-dependency-security.yml \
            04-code-health.yml
          do
            encoded="$(jq -rn --arg value "$SCAN_BRANCH" '$value|@uri')"
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded}" --jq '.commit.sha')"
            if [[ "${current_sha,,}" != "$SCAN_SHA" ]]; then
              echo "Branch moved from $SCAN_SHA to $current_sha before $workflow dispatch; refusing a mixed-commit scan" >&2
              exit 1
            fi
            # The selected target branch need not contain the analysis workflows.
            # Execute the approved default-branch definition; inputs pin checkout to
            # the exact selected branch head.
            gh workflow run "$workflow" --ref "$WORKFLOW_REF" \
              -f scan_sha="$SCAN_SHA" \
              -f scan_branch="$SCAN_BRANCH"
          done
          final_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded}" --jq '.commit.sha')"
          if [[ "${final_sha,,}" != "$SCAN_SHA" ]]; then
            echo "Branch moved while scanners were dispatched; no exact-set publication is authorized" >&2
            exit 1
          fi
          for workflow in \
            01-code-quality.yml \
            02-security-sast.yml \
            03-dependency-security.yml \
            04-code-health.yml
          do
            run_id=""
            run_url=""
            case "$workflow" in
              01-code-quality.yml) run_title="Code Quality · $SCAN_BRANCH · $SCAN_SHA" ;;
              02-security-sast.yml) run_title="Security / SAST · $SCAN_BRANCH · $SCAN_SHA" ;;
              03-dependency-security.yml) run_title="Dependency & Supply Chain Security · $SCAN_BRANCH · $SCAN_SHA" ;;
              04-code-health.yml) run_title="Code Health & Technical Debt · $SCAN_BRANCH · $SCAN_SHA" ;;
              *) echo "Unknown scanner workflow: $workflow" >&2; exit 1 ;;
            esac
            for attempt in $(seq 1 30); do
              runs="$(gh run list --workflow "$workflow" \
                --event workflow_dispatch --limit 20 \
                --json databaseId,createdAt,displayTitle,url)"
              run_id="$(jq -r --arg started "$dispatched_at" --arg title "$run_title" \
                '[.[] | select(.createdAt >= $started and .displayTitle == $title)] | sort_by(.createdAt) | last | .databaseId // empty' \
                <<<"$runs")"
              run_url="$(jq -r --arg started "$dispatched_at" --arg title "$run_title" \
                '[.[] | select(.createdAt >= $started and .displayTitle == $title)] | sort_by(.createdAt) | last | .url // empty' \
                <<<"$runs")"
              [[ -n "$run_id" ]] && break
              sleep 5
            done
            if [[ -z "$run_id" ]]; then
              echo "::error::Could not locate the dispatched $workflow run for $SCAN_SHA"
              exit 1
            fi
            printf '%s\t%s\t%s\n' "$workflow" "$run_id" "$run_url" >> scanner-runs.tsv
            printf '%s\n' "- [$workflow]($run_url)" >> manual-analysis-summary.md
          done

      - name: Wait for all scanner groups
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r workflow run_id run_url; do
            echo "Waiting for $workflow ($run_url)"
            gh run watch "$run_id" --exit-status
          done < scanner-runs.tsv
          echo >> manual-analysis-summary.md
          echo "All four scanner groups completed successfully." >> manual-analysis-summary.md

      - name: Build the exact-commit dashboard
        id: dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_BRANCH: ${{ steps.target.outputs.branch }}
          SCAN_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          title="Dashboard · $SCAN_BRANCH · $SCAN_SHA"
          gh workflow run 05-issue-aggregation.yml --ref "$default_branch" \
            -f scan_branch="$SCAN_BRANCH" \
            -f scan_sha="$SCAN_SHA"
          dashboard_id=""
          dashboard_url=""
          for attempt in $(seq 1 30); do
            runs="$(gh run list --workflow 05-issue-aggregation.yml \
              --event workflow_dispatch --limit 30 \
              --json databaseId,createdAt,displayTitle,url)"
            dashboard_id="$(jq -r --arg started "$dispatched_at" --arg title "$title" \
              '[.[] | select(.createdAt >= $started and .displayTitle == $title)] | sort_by(.createdAt) | last | .databaseId // empty' \
              <<<"$runs")"
            dashboard_url="$(jq -r --arg started "$dispatched_at" --arg title "$title" \
              '[.[] | select(.createdAt >= $started and .displayTitle == $title)] | sort_by(.createdAt) | last | .url // empty' \
              <<<"$runs")"
            [[ -n "$dashboard_id" ]] && break
            sleep 5
          done
          if [[ -z "$dashboard_id" ]]; then
            echo "::error::Could not locate the exact-commit dashboard run"
            exit 1
          fi
          echo "dashboard-url=$dashboard_url" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "### Dashboard"
            echo "- [Open dashboard build and download the searchable artifact]($dashboard_url)"
          } >> manual-analysis-summary.md
          gh run watch "$dashboard_id" --exit-status

      - name: Publish operator summary
        if: always()
        env:
          DASHBOARD_URL: ${{ steps.dashboard.outputs.dashboard-url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f manual-analysis-summary.md ]]; then
            cat manual-analysis-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Full code analysis did not initialize" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            echo "- Final dashboard URL: ${DASHBOARD_URL:-not published}"
            echo "- Source, Issue, PR-comment, patch, autofix, and deployment writes: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
