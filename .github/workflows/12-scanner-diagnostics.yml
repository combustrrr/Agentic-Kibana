# Generated scanner diagnostics; never publishes a target report.
name: Scanner access diagnostics
run-name: Scanner diagnostics ${{ inputs.request_id }}
'on':
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: string
      tooling_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: scanner-diagnostics
  cancel-in-progress: true
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.identity.outputs.jobs }}
      languages: ${{ steps.identity.outputs.languages }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Validate trusted tooling and selected target
      id: identity
      env:
        TARGET_JSON: ${{ inputs.target }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
      run: python -m scripts.code_analysis.source_identity
  scanner-1-sonarqube-cloud:
    name: SonarQube Cloud (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_API_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    steps:
    - name: Checkout exact scan commit
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 0
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted Sonar tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: ${{ github.repository }}
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Determine whether Sonar analysis is needed
      id: sonar-scope
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        SCAN_SHA: ${{ fromJSON(inputs.target).head_sha }}
      shell: bash
      run: "set -euo pipefail\nshould_scan=false\nif [[ \"$EVENT_NAME\" == workflow_dispatch ]]; then\n  should_scan=true\n\
        else\n  base=\"$BEFORE_SHA\"\n  if [[ \"$EVENT_NAME\" == pull_request ]]; then\n    base=\"$BASE_SHA\"\n\
        \  fi\n  if [[ -z \"$base\" || \"$base\" =~ ^0+$ ]] || ! git cat-file -e \"${base}^{commit}\"; then\n  \
        \  should_scan=true\n  elif git diff --name-only \"$base\" \"$SCAN_SHA\" | grep -Eq \\\n    '^(backend/app/|webui/src/|scripts/code_analysis/export_sonar_issues\\\
        .py$|sonar-project\\.properties$|\\.github/workflows/01-code-quality\\.yml$)'; then\n    should_scan=true\n\
        \  fi\nfi\nprintf 'should_scan=%s\\n' \"$should_scan\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Ensure Browse for the verified Sonar API user
      if: env.SONAR_API_TOKEN != ''
      env:
        SCAN_BRANCH: ${{ fromJSON(inputs.target).branch || github.head_ref || github.ref_name }}
      run: 'python $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/ensure_sonar_browse.py

        cat sonar-browse-grant.json

        '
      continue-on-error: true
    - name: Derive stable Sonar analysis branch
      id: sonar-identity
      env:
        SOURCE_BRANCH: ${{ fromJSON(inputs.target).branch || github.head_ref || github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      shell: bash
      run: "set -euo pipefail\nsonar_branch=\"$SOURCE_BRANCH\"\nif [[ \"$SOURCE_BRANCH\" != \"$DEFAULT_BRANCH\"\
        \ ]]; then\n  branch_hash=\"$(printf '%s' \"$SOURCE_BRANCH\" | sha256sum | cut -c1-16)\"\n  sonar_branch=\"\
        branch-issue-wall-$branch_hash\"\nfi\nprintf 'sonar_branch=%s\\n' \"$sonar_branch\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - name: Probe Sonar credentials without exposing secrets
      if: env.SONAR_TOKEN != '' || env.SONAR_API_TOKEN != ''
      env:
        SCAN_BRANCH: ${{ steps.sonar-identity.outputs.sonar_branch }}
      run: 'python $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/probe_sonar_access.py

        cat sonar-access-probe.json


        python -c ''import json; p=json.load(open("sonar-access-probe.json")); print("native_export_ready="+str(p["credentials"].get("issue_api",{}).get("project_issues_http_status")==200
        and p["credentials"].get("issue_api",{}).get("branch_issues_http_status") not in (401,403)).lower())'' >>
        "$GITHUB_OUTPUT"

        python -c ''import json; p=json.load(open("sonar-access-probe.json")); print("access_failure="+p["credentials"].get("issue_api",{}).get("access_failure",""))''
        >> "$GITHUB_OUTPUT"'
      id: sonar-access
    - name: Record unconfigured status
      if: steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_TOKEN == ''
      shell: bash
      run: 'printf ''%s\n'' ''{"schema_version":"1","scanner_family":"SonarQube Cloud","status":"NOT_CONFIGURED","reason":"SONAR_TOKEN
        is unavailable (expected for external fork pull requests)"}'' > sonar-status.json

        '
    - name: Record out-of-scope status
      if: steps.sonar-scope.outputs.should_scan != 'true'
      shell: bash
      run: 'printf ''%s\n'' ''{"schema_version":"1","scanner_family":"SonarQube Cloud","status":"NOT_APPLICABLE","reason":"No
        product source or Sonar configuration changed"}'' > sonar-status.json

        '
    - name: Analyze native push or pull-request event
      id: sonar-native
      if: steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_TOKEN != '' && github.event_name != 'workflow_dispatch'
        && steps.sonar-access.outputs.native_export_ready == 'true'
      continue-on-error: true
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
      with:
        args: -Dproject.settings=${{ runner.temp }}/analysis-tooling/sonar-project.properties ${{ github.event_name
          == 'push' && format('-Dsonar.branch.name={0} -Dsonar.scm.revision={1}', steps.sonar-identity.outputs.sonar_branch,
          github.sha) || '' }}
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
    - name: Analyze manually selected branch head
      id: sonar-manual
      if: steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_TOKEN != '' && github.event_name == 'workflow_dispatch'
        && steps.sonar-access.outputs.native_export_ready == 'true'
      continue-on-error: true
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
      with:
        args: -Dproject.settings=${{ runner.temp }}/analysis-tooling/sonar-project.properties -Dsonar.branch.name=${{
          steps.sonar-identity.outputs.sonar_branch }} -Dsonar.scm.revision=${{ fromJSON(inputs.target).head_sha
          }}
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
    - name: Export native Sonar issues for Issue Wall
      id: sonar-export
      if: always() && steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_API_TOKEN != '' && (steps.sonar-native.outcome
        == 'success' || steps.sonar-manual.outcome == 'success')
      continue-on-error: true
      env:
        SCAN_BRANCH: ${{ fromJSON(inputs.target).branch || github.head_ref || github.ref_name }}
        SCAN_SHA: ${{ fromJSON(inputs.target).head_sha }}
        PULL_REQUEST: ${{ github.event.pull_request.number }}
        SONAR_BRANCH: ${{ steps.sonar-identity.outputs.sonar_branch }}
      shell: bash
      run: "python $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/export_sonar_issues.py \\\n  --report-task\
        \ .scannerwork/report-task.txt \\\n  --output sonar-native-issues.json \\\n  --project combustrrr_Agentic-Kibana\
        \ \\\n  --branch \"$SCAN_BRANCH\" \\\n  --sonar-branch \"$SONAR_BRANCH\" \\\n  --commit \"$SCAN_SHA\" \\\
        \n  --pull-request \"$PULL_REQUEST\"\n"
    - name: Record configured scan status
      if: always() && steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_TOKEN != ''
      env:
        EVENT_NAME: ${{ github.event_name }}
        NATIVE_OUTCOME: ${{ steps.sonar-native.outcome }}
        MANUAL_OUTCOME: ${{ steps.sonar-manual.outcome }}
        EXPORT_OUTCOME: ${{ steps.sonar-export.outcome }}
        EXPORT_READY: ${{ steps.sonar-access.outputs.native_export_ready }}
        ACCESS_FAILURE: ${{ steps.sonar-access.outputs.access_failure }}
      shell: bash
      run: "outcome=\"$NATIVE_OUTCOME\"\nif [[ \"$EVENT_NAME\" == workflow_dispatch ]]; then\n  outcome=\"$MANUAL_OUTCOME\"\
        \nfi\nstatus=CONFIGURED_COMPLETE\nreason=\"\"\nif [[ \"$outcome\" != success ]]; then\n  status=CONFIGURED_PARTIAL\n\
        \  reason=\"SonarQube Cloud analysis failed; inspect the scanner log\"\nelif [[ -z \"$SONAR_API_TOKEN\"\
        \ ]]; then\n  status=CONFIGURED_PARTIAL\n  reason=\"SONAR_API_TOKEN with project Browse permission is not\
        \ configured\"\nelif [[ \"$EXPORT_OUTCOME\" != success ]]; then\n  status=CONFIGURED_PARTIAL\n  reason=\"\
        SonarQube Cloud analysis completed but native issue export failed\"\nfi\nif [[ \"$EXPORT_READY\" != true\
        \ ]]; then\n  reason=\"Sonar native issue API is unavailable to the configured credential; analysis awaits\
        \ export access\"\nfi\nif [[ \"$ACCESS_FAILURE\" == branch_entitlement ]]; then\n  reason=\"Sonar organization\
        \ denies non-main-branch data access; enable branch entitlement. Token validity and Browse permission do\
        \ not resolve this restriction.\"\nfi\njq -n --arg status \"$status\" --arg reason \"$reason\" --arg outcome\
        \ \"$outcome\" --arg export \"$EXPORT_OUTCOME\" \\\n  '{schema_version:\"1\",scanner_family:\"SonarQube\
        \ Cloud\",status:$status,reason:$reason,surfaces:{analysis:$outcome,native_issue_export:$export}}' \\\n\
        \  > sonar-status.json\n"
    - name: Upload SonarQube Cloud status
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: sonar-results
        path: 'sonar-status.json

          sonar-access-probe.json

          sonar-browse-grant.json

          sonar-native-issues.json

          .scannerwork/report-task.txt

          '
        if-no-files-found: error
        retention-days: 7
    needs:
    - identity
    permissions:
      contents: read
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'sonarqube-cloud') }}
  scanner-3-snyk:
    name: Snyk (Optional SCA + Code)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
      SNYK_CONFIGURED: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ github.repository }}
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Record unconfigured status
      if: env.SNYK_CONFIGURED != 'true'
      shell: bash
      run: 'printf ''%s\n'' ''{"schema_version":"1","scanner_family":"Snyk","status":"NOT_CONFIGURED","reason":"SNYK_TOKEN
        is not configured"}'' > snyk-status.json

        '
    - name: Install pinned Snyk CLI
      if: env.SNYK_CONFIGURED == 'true'
      run: npm install --global snyk@1.1306.4
    - name: Set up Python 3.11 for complete pip dependency trees
      if: env.SNYK_CONFIGURED == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: '.ci/requirements.txt

          backend/requirements.txt

          docs/requirements.txt

          '
    - name: Resolve Python dependency manifests for Snyk SCA
      if: env.SNYK_CONFIGURED == 'true'
      shell: bash
      run: python -I $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/snyk_metadata.py --source "$GITHUB_WORKSPACE"
        --destination "$RUNNER_TEMP/snyk-metadata"
    - name: Scan open-source dependencies
      id: snyk-sca
      if: env.SNYK_CONFIGURED == 'true'
      continue-on-error: true
      shell: bash
      run: 'set -o pipefail

        python -I $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/snyk_scan.py 2>&1 | tee snyk-open-source.log'
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    - name: Scan source code
      id: snyk-code
      if: env.SNYK_CONFIGURED == 'true'
      continue-on-error: true
      shell: bash
      run: 'set +e

        snyk code test --sarif-file-output=snyk-code.sarif 2>&1 | tee snyk-code.log

        scan_exit=${PIPESTATUS[0]}

        set -e

        # Exit 1 means findings. Exit 2+ means unavailable/invalid analysis.

        [[ "$scan_exit" -le 1 ]] || exit "$scan_exit"

        '
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    - name: Record configured scan status
      if: always() && env.SNYK_CONFIGURED == 'true'
      env:
        SCA_OUTCOME: ${{ steps.snyk-sca.outcome }}
        CODE_OUTCOME: ${{ steps.snyk-code.outcome }}
      shell: bash
      run: "status=CONFIGURED_COMPLETE\nreason=\"\"\nif [[ \"$SCA_OUTCOME\" != success || \"$CODE_OUTCOME\" != success\
        \ ]]; then\n  status=CONFIGURED_PARTIAL\n  reason=\"One or more Snyk analysis surfaces were unavailable\
        \ or incomplete; inspect the retained logs\"\nfi\nif [[ \"$SCA_OUTCOME\" != success || \"$CODE_OUTCOME\"\
        \ != success ]] && grep -q \"monthly limit\" snyk-*.log; then\n  reason=\"Snyk execution incomplete; a quota\
        \ warning was also emitted. Inspect the failing manifest or surface before attributing the failure to quota.\"\
        \nfi\njq -n \\\n  --arg status \"$status\" \\\n  --arg reason \"$reason\" \\\n  --arg sca \"$SCA_OUTCOME\"\
        \ \\\n  --arg code \"$CODE_OUTCOME\" \\\n  '{schema_version:\"1\",scanner_family:\"Snyk\",status:$status,reason:$reason,surfaces:{sca:$sca,code:$code}}'\
        \ \\\n  > snyk-status.json\n"
    - name: Upload structured Snyk evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: snyk-results
        path: 'snyk-status.json

          snyk-open-source.sarif

          snyk-code.sarif

          snyk-open-source.log

          snyk-code.log

          '
        if-no-files-found: error
        retention-days: 7
    - name: Upload isolated resolver diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: snyk-resolver-diagnostics
        path: ${{ runner.temp }}/snyk-resolver-error.json
        if-no-files-found: ignore
        retention-days: 7
    needs:
    - identity
    permissions:
      contents: read
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'snyk') }}
