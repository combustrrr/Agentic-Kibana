  scanner-3-snyk:
    name: Snyk (Optional SCA + Code)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
      SNYK_CONFIGURED: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
