  scanner-7-atheris-state-machine:
    name: Atheris (Bounded Decision-State Fuzzing)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout exact workflow target
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ github.repository }}
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install bounded fuzz target
      shell: bash
      run: 'set -euo pipefail

        pip install -r backend/requirements.txt "atheris==3.0.0"

        '
    - name: Run deterministic case-decision fuzz campaign
      id: atheris
      shell: bash
      run: "set -euo pipefail\nmkdir -p fuzz-corpus fuzz-crashes\nprintf '\\x00\\xff\\x32\\x01' > fuzz-corpus/seed-false-positive\n\
        printf '\\x01\\xff\\x64\\x02' > fuzz-corpus/seed-true-positive\ncd backend\npython $RUNNER_TEMP/analysis-tooling/tests/security_canary/fuzzing/atheris_state_fuzzer.py\
        \ \\\n  -runs=25000 -max_len=4096 -timeout=5 \\\n  -artifact_prefix=../fuzz-crashes/ ../fuzz-corpus\ncd\
        \ ..\njq -n '{schema_version:\"1\",scanner_family:\"Atheris\",status:\"COMPLETED_OPTIONAL\",reason:\"25,000\
        \ bounded inputs executed against deterministic case decision logic\",finding_count:0,observation_count:0}'\
        \ \\\n  > atheris-status.json\n"
    - name: Record Atheris operational failure
      if: failure() && steps.atheris.outcome == 'failure'
      shell: bash
      run: "jq -n '{schema_version:\"1\",scanner_family:\"Atheris\",status:\"OPERATIONAL_FAILURE\",reason:\"The\
        \ bounded Atheris campaign did not complete; inspect the job log and retained crash input.\",finding_count:0,observation_count:0}'\
        \ \\\n  > atheris-status.json\n"
    - name: Retain Atheris campaign evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: atheris-state-fuzzing
        path: 'atheris-status.json

          fuzz-crashes/

          '
        if-no-files-found: warn
        retention-days: 7
    needs:
    - identity
    permissions:
      contents: read
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'atheris-state-machine') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
      ANALYSIS_BACKEND_ROOT: ${{ github.workspace }}/backend
      ANALYSIS_SOURCE_SHA: ${{ fromJSON(inputs.target).head_sha }}
  report:
    needs:
    - identity
    - scanner-1-sonarqube-cloud
    - scanner-1-python-ruff
    - scanner-1-python-bandit
    - scanner-1-python-types
    - scanner-1-typescript-quality
    - scanner-2-codeql
    - scanner-2-semgrep
    - scanner-3-snyk
    - scanner-3-osv-scanner
    - scanner-3-gitleaks
    - scanner-3-trivy
    - scanner-3-hadolint
    - scanner-3-checkov
    - scanner-3-shipping-image-security
    - scanner-3-workflow-security-posture
    - scanner-3-openssf-scorecard
    - scanner-4-complexity
    - scanner-4-dead-code
    - scanner-4-test-coverage
    - scanner-7-schemathesis-fuzz
    - scanner-7-atheris-state-machine
    if: ${{ always() && needs.identity.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: Install trusted reporting dependencies
      run: python -m pip install click==8.2.1 ruff==0.12.5
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Collect exact producer artifacts and assemble report
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_JSON: ${{ inputs.target }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
      run: python -m scripts.code_analysis.source_identity --assemble
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: hosted-report-${{ github.run_id }}-${{ github.run_attempt }}
        path: .hosted/report/
        if-no-files-found: error
        retention-days: 7
