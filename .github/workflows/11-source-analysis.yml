        exit-code: '0'
    - name: Scan web UI image vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: agentic-soc-webui:analysis
