# Generated by scripts/code_analysis/generate_source_workflow.py; do not edit by hand.
name: Exact Source Analysis
run-name: Source analysis ${{ inputs.request_id }}
'on':
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: string
      tooling_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: source-${{ fromJSON(inputs.target).id }}
  cancel-in-progress: true
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.identity.outputs.jobs }}
      languages: ${{ steps.identity.outputs.languages }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Validate trusted tooling and selected target
      id: identity
      env:
        TARGET_JSON: ${{ inputs.target }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
      run: python -m scripts.code_analysis.source_identity
  scanner-1-sonarqube-cloud:
    name: SonarQube Cloud (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_API_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    steps:
    - name: Checkout exact scan commit
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 0
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted Sonar tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: ${{ github.repository }}
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Determine whether Sonar analysis is needed
      id: sonar-scope
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        SCAN_SHA: ${{ fromJSON(inputs.target).head_sha }}
      shell: bash
      run: "set -euo pipefail\nshould_scan=false\nif [[ \"$EVENT_NAME\" == workflow_dispatch ]]; then\n  should_scan=true\n\
        else\n  base=\"$BEFORE_SHA\"\n  if [[ \"$EVENT_NAME\" == pull_request ]]; then\n    base=\"$BASE_SHA\"\n\
        \  fi\n  if [[ -z \"$base\" || \"$base\" =~ ^0+$ ]] || ! git cat-file -e \"${base}^{commit}\"; then\n  \
        \  should_scan=true\n  elif git diff --name-only \"$base\" \"$SCAN_SHA\" | grep -Eq \\\n    '^(backend/app/|webui/src/|scripts/code_analysis/export_sonar_issues\\\
        .py$|sonar-project\\.properties$|\\.github/workflows/01-code-quality\\.yml$)'; then\n    should_scan=true\n\
        \  fi\nfi\nprintf 'should_scan=%s\\n' \"$should_scan\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Ensure Browse for the verified Sonar API user
      if: env.SONAR_API_TOKEN != ''
      env:
        SCAN_BRANCH: ${{ fromJSON(inputs.target).branch || github.head_ref || github.ref_name }}
      run: 'python $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/ensure_sonar_browse.py

        cat sonar-browse-grant.json

        '
      continue-on-error: true
    - name: Derive stable Sonar analysis branch
      id: sonar-identity
      env:
        SOURCE_BRANCH: ${{ fromJSON(inputs.target).branch || github.head_ref || github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      shell: bash
      run: "set -euo pipefail\nsonar_branch=\"$SOURCE_BRANCH\"\nif [[ \"$SOURCE_BRANCH\" != \"$DEFAULT_BRANCH\"\
        \ ]]; then\n  branch_hash=\"$(printf '%s' \"$SOURCE_BRANCH\" | sha256sum | cut -c1-16)\"\n  sonar_branch=\"\
        branch-issue-wall-$branch_hash\"\nfi\nprintf 'sonar_branch=%s\\n' \"$sonar_branch\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - name: Probe Sonar credentials without exposing secrets
      if: env.SONAR_TOKEN != '' || env.SONAR_API_TOKEN != ''
      env:
        SCAN_BRANCH: ${{ steps.sonar-identity.outputs.sonar_branch }}
      run: 'python $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/probe_sonar_access.py

        cat sonar-access-probe.json


        python -c ''import json; p=json.load(open("sonar-access-probe.json")); print("native_export_ready="+str(p["credentials"].get("issue_api",{}).get("project_issues_http_status")==200
        and p["credentials"].get("issue_api",{}).get("branch_issues_http_status") not in (401,403)).lower())'' >>
        "$GITHUB_OUTPUT"

        python -c ''import json; p=json.load(open("sonar-access-probe.json")); print("access_failure="+p["credentials"].get("issue_api",{}).get("access_failure",""))''
        >> "$GITHUB_OUTPUT"'
      id: sonar-access
    - name: Record unconfigured status
      if: steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_TOKEN == ''
      shell: bash
      run: 'printf ''%s\n'' ''{"schema_version":"1","scanner_family":"SonarQube Cloud","status":"NOT_CONFIGURED","reason":"SONAR_TOKEN
        is unavailable (expected for external fork pull requests)"}'' > sonar-status.json

        '
    - name: Record out-of-scope status
      if: steps.sonar-scope.outputs.should_scan != 'true'
      shell: bash
      run: 'printf ''%s\n'' ''{"schema_version":"1","scanner_family":"SonarQube Cloud","status":"NOT_APPLICABLE","reason":"No
        product source or Sonar configuration changed"}'' > sonar-status.json

        '
    - name: Analyze native push or pull-request event
      id: sonar-native
      if: steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_TOKEN != '' && github.event_name != 'workflow_dispatch'
        && steps.sonar-access.outputs.native_export_ready == 'true'
      continue-on-error: true
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
      with:
        args: -Dproject.settings=${{ runner.temp }}/analysis-tooling/sonar-project.properties ${{ github.event_name
          == 'push' && format('-Dsonar.branch.name={0} -Dsonar.scm.revision={1}', steps.sonar-identity.outputs.sonar_branch,
          github.sha) || '' }}
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
    - name: Analyze manually selected branch head
      id: sonar-manual
      if: steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_TOKEN != '' && github.event_name == 'workflow_dispatch'
        && steps.sonar-access.outputs.native_export_ready == 'true'
      continue-on-error: true
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
      with:
        args: -Dproject.settings=${{ runner.temp }}/analysis-tooling/sonar-project.properties -Dsonar.branch.name=${{
          steps.sonar-identity.outputs.sonar_branch }} -Dsonar.scm.revision=${{ fromJSON(inputs.target).head_sha
          }}
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
    - name: Export native Sonar issues for Issue Wall
      id: sonar-export
      if: always() && steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_API_TOKEN != '' && (steps.sonar-native.outcome
        == 'success' || steps.sonar-manual.outcome == 'success')
      continue-on-error: true
      env:
        SCAN_BRANCH: ${{ fromJSON(inputs.target).branch || github.head_ref || github.ref_name }}
        SCAN_SHA: ${{ fromJSON(inputs.target).head_sha }}
        PULL_REQUEST: ${{ github.event.pull_request.number }}
        SONAR_BRANCH: ${{ steps.sonar-identity.outputs.sonar_branch }}
      shell: bash
      run: "python $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/export_sonar_issues.py \\\n  --report-task\
        \ .scannerwork/report-task.txt \\\n  --output sonar-native-issues.json \\\n  --project combustrrr_Agentic-Kibana\
        \ \\\n  --branch \"$SCAN_BRANCH\" \\\n  --sonar-branch \"$SONAR_BRANCH\" \\\n  --commit \"$SCAN_SHA\" \\\
        \n  --pull-request \"$PULL_REQUEST\"\n"
    - name: Record configured scan status
      if: always() && steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_TOKEN != ''
      env:
        EVENT_NAME: ${{ github.event_name }}
        NATIVE_OUTCOME: ${{ steps.sonar-native.outcome }}
        MANUAL_OUTCOME: ${{ steps.sonar-manual.outcome }}
        EXPORT_OUTCOME: ${{ steps.sonar-export.outcome }}
        EXPORT_READY: ${{ steps.sonar-access.outputs.native_export_ready }}
        ACCESS_FAILURE: ${{ steps.sonar-access.outputs.access_failure }}
      shell: bash
      run: "outcome=\"$NATIVE_OUTCOME\"\nif [[ \"$EVENT_NAME\" == workflow_dispatch ]]; then\n  outcome=\"$MANUAL_OUTCOME\"\
        \nfi\nstatus=CONFIGURED_COMPLETE\nreason=\"\"\nif [[ \"$outcome\" != success ]]; then\n  status=CONFIGURED_PARTIAL\n\
        \  reason=\"SonarQube Cloud analysis failed; inspect the scanner log\"\nelif [[ -z \"$SONAR_API_TOKEN\"\
        \ ]]; then\n  status=CONFIGURED_PARTIAL\n  reason=\"SONAR_API_TOKEN with project Browse permission is not\
        \ configured\"\nelif [[ \"$EXPORT_OUTCOME\" != success ]]; then\n  status=CONFIGURED_PARTIAL\n  reason=\"\
        SonarQube Cloud analysis completed but native issue export failed\"\nfi\nif [[ \"$EXPORT_READY\" != true\
        \ ]]; then\n  reason=\"Sonar native issue API is unavailable to the configured credential; analysis awaits\
        \ export access\"\nfi\nif [[ \"$ACCESS_FAILURE\" == branch_entitlement ]]; then\n  reason=\"Sonar organization\
        \ denies non-main-branch data access; enable branch entitlement. Token validity and Browse permission do\
        \ not resolve this restriction.\"\nfi\njq -n --arg status \"$status\" --arg reason \"$reason\" --arg outcome\
        \ \"$outcome\" --arg export \"$EXPORT_OUTCOME\" \\\n  '{schema_version:\"1\",scanner_family:\"SonarQube\
        \ Cloud\",status:$status,reason:$reason,surfaces:{analysis:$outcome,native_issue_export:$export}}' \\\n\
        \  > sonar-status.json\n"
    - name: Upload SonarQube Cloud status
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: sonar-results
        path: 'sonar-status.json

          sonar-access-probe.json

          sonar-browse-grant.json

          sonar-native-issues.json

          .scannerwork/report-task.txt

          '
        if-no-files-found: error
        retention-days: 7
    needs:
    - identity
    permissions:
      contents: read
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'sonarqube-cloud') }}
  scanner-1-python-ruff:
    name: Ruff (Python Lint + Format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 0
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: ${{ github.repository }}
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: ${{ runner.temp }}/analysis-tooling/.ci/requirements.txt
    - name: Install pinned tools
      run: python -m pip install --requirement $RUNNER_TEMP/analysis-tooling/.ci/requirements.txt
    - name: Enforce code-analysis workflow policy
      run: python $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/audit_workflows.py
    - name: "Ruff lint (default rules \u2014 matches existing python-static CI gate)"
      run: python -m ruff check backend/app backend/tests --exit-zero
    - name: "Ruff lint (extended rules \u2014 advisory for baseline phase)"
      run: "python -m ruff check backend/ \\\n  --config $RUNNER_TEMP/analysis-tooling/backend/pyproject.toml \\\
        \n  --output-format=github \\\n  --exit-zero\n"
    - name: Ruff format check (advisory)
      run: "python -m ruff format --check backend/ \\\n  --config $RUNNER_TEMP/analysis-tooling/backend/pyproject.toml\
        \ \\\n  || true\n"
    - name: Ruff lint (JSON for normalizer)
      if: always()
      run: "python -m ruff check backend/ \\\n  --config $RUNNER_TEMP/analysis-tooling/backend/pyproject.toml \\\
        \n  --output-format=json \\\n  --exit-zero \\\n  --output-file ruff-results.json\n"
    - name: Upload Ruff results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ruff-results
        path: ruff-results.json
        if-no-files-found: error
        retention-days: 7
    needs:
    - identity
    permissions:
      contents: read
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'python-ruff') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-1-python-bandit:
    name: Bandit (Python Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: ${{ github.repository }}
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: ${{ runner.temp }}/analysis-tooling/.ci/requirements.txt
    - name: Install tools
      run: python -m pip install --requirement $RUNNER_TEMP/analysis-tooling/.ci/requirements.txt
    - name: Run Bandit (JSON, advisory for baseline)
      run: "bandit \\\n  -r backend/ \\\n  -c backend/pyproject.toml \\\n  --format json \\\n  --output bandit-results.json\
        \ \\\n  --exit-zero\n"
    - name: Normalize Bandit JSON to SARIF
      run: "mkdir -p bandit-scan-results\ncp bandit-results.json bandit-scan-results/\npython $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/normalizer.py\
        \ \\\n  --input-dir bandit-scan-results \\\n  --output-dir bandit-normalized\n"
    - name: Report HIGH severity findings (informational)
      if: always()
      run: "python - <<'PY'\nimport json\ndata = json.load(open(\"bandit-results.json\", encoding=\"utf-8\"))\n\
        results = data.get(\"results\", [])\ncounts = {level: sum(r.get(\"issue_severity\") == level for r in results)\n\
        \          for level in (\"CRITICAL\", \"HIGH\", \"MEDIUM\", \"LOW\")}\nprint(f\"Bandit findings: {len(results)}\
        \ total ({counts})\")\nfor finding in results:\n    if finding.get(\"issue_severity\") in {\"CRITICAL\"\
        , \"HIGH\"}:\n        print(f\"  {finding.get('test_id', '')} | {finding.get('filename', '')}:\"\n     \
        \         f\"{finding.get('line_number', '')} | {finding.get('issue_text', '')[:100]}\")\nPY\n"
    - name: Build bounded GitHub Security SARIF view
      run: "python $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/bound_sarif.py \\\n  --input bandit-normalized/normalized.sarif\
        \ \\\n  --output bandit-normalized/github-security.sarif \\\n  --maximum 5000\n"
    - name: Upload Bandit results artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: bandit-results
        path: 'bandit-results.json

          bandit-normalized/normalized.sarif

          '
        retention-days: 7
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'python-bandit') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-1-python-types:
    name: Pyright (Python Type Checking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - name: Install dependencies + Pyright
      run: 'python -m pip install --upgrade pip

        pip install -r backend/requirements.txt

        pip install -r backend/requirements-dev.txt

        pip install "pyright==1.1.411"

        '
    - name: Run Pyright (advisory)
      run: "pyright backend/app \\\n  --outputjson > pyright-results.json \\\n  || true\n"
    - name: Upload Pyright results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pyright-results
        path: pyright-results.json
        retention-days: 7
    needs:
    - identity
    permissions:
      contents: read
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'python-types') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-1-typescript-quality:
    name: ESLint + tsc (TypeScript/React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ github.repository }}
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Node.js 22
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: webui/package-lock.json
    - name: Install locked dependencies
      run: PYTHONPATH="$RUNNER_TEMP/analysis-tooling" python -m scripts.code_analysis.run_profile javascript-install
        --source "$GITHUB_WORKSPACE"
    - name: TypeScript type check
      shell: bash
      run: 'set +e

        npx tsc --noEmit --pretty false 2>&1 | tee tsc-results.txt

        exit 0

        '
    - name: ESLint lint (human-readable advisory output)
      run: npx eslint "src/**/*.{ts,tsx}" --format stylish || true
    - name: "ESLint lint (fail on error \u2014 matches existing webui-lint CI gate)"
      continue-on-error: true
      run: npx eslint "src/**/*.{ts,tsx}"
    - name: Upload ESLint results (for normalizer)
      if: always()
      run: 'npx eslint "src/**/*.{ts,tsx}" --format json --output-file eslint-results.json || true

        '
    - name: Upload ESLint results artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: eslint-results
        path: webui/eslint-results.json
        retention-days: 7
    - name: Upload TypeScript results artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: tsc-results
        path: webui/tsc-results.txt
        retention-days: 7
    - name: Run repository JavaScript test profile
      if: always()
      run: PYTHONPATH="$RUNNER_TEMP/analysis-tooling" python -m scripts.code_analysis.run_profile javascript-test
        --source "$GITHUB_WORKSPACE"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: typescript-tests
        path: typescript-test-status.json
        retention-days: 7
    needs:
    - identity
    permissions:
      contents: read
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'typescript-quality') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-2-codeql:
    name: CodeQL (Semantic SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.identity.outputs.languages) }}
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 2
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: ${{ github.repository }}
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Stage trusted CodeQL policy in Git metadata
      run: 'mkdir -p "$GITHUB_WORKSPACE/.git/code-analysis"

        cp "$RUNNER_TEMP/analysis-tooling/.github/codeql/codeql-config.yml" "$GITHUB_WORKSPACE/.git/code-analysis/codeql-config.yml"'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        languages: ${{ matrix.language }}
        queries: +security-extended,security-and-quality
        config-file: .git/code-analysis/codeql-config.yml
    - name: "Build (Python \u2014 no explicit build needed)"
      if: matrix.language == 'python'
      run: "echo \"Python \u2014 autobuild skipped, using source\""
    - name: Autobuild (TypeScript/React)
      if: matrix.language == 'javascript-typescript'
      uses: github/codeql-action/autobuild@42947a340483f03ba47bb1a039b2c519aab3df85
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        category: /language:${{ matrix.language }}
        output: codeql-output
        upload: false
