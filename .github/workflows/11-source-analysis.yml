      shell: bash
      run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${SOURCE_REPOSITORY}\")\"\nsecret_scanning=\"$(jq -r\
        \ '.security_and_analysis.secret_scanning.status // \"UNAVAILABLE\"' <<<\"$repo_json\")\"\npush_protection=\"\
        $(jq -r '.security_and_analysis.secret_scanning_push_protection.status // \"UNAVAILABLE\"' <<<\"$repo_json\"\
        )\"\nalerts_status=UNAVAILABLE\nalert_count=null\nif gh api --paginate \"repos/${SOURCE_REPOSITORY}/secret-scanning/alerts?state=open&per_page=100\"\
        \ \\\n    --jq '.[].number' > secret-scanning-alert-numbers.txt 2>secret-scanning-api.log; then\n  alerts_status=OBSERVED\n\
        \  alert_count=\"$(wc -l < secret-scanning-alert-numbers.txt)\"\nelse\n  : > secret-scanning-alert-numbers.txt\n\
        fi\nposture_status=CONFIGURED_COMPLETE\nposture_reason=\"Secret scanning and push protection enabled; open-alert\
        \ count observed without secret values\"\nif [[ \"$secret_scanning\" == UNAVAILABLE || \"$push_protection\"\
        \ == UNAVAILABLE || \"$alerts_status\" == UNAVAILABLE ]]; then\n  posture_status=CONFIGURED_PARTIAL\n  posture_reason=\"\
        GitHub token cannot observe one or more secret-protection controls; configure a read-only SECURITY_POSTURE_TOKEN\"\
        \nelif [[ \"$secret_scanning\" != enabled || \"$push_protection\" != enabled ]]; then\n  posture_status=CONFIGURED_PARTIAL\n\
        \  posture_reason=\"One or more GitHub secret-protection controls require repository-owner activation\"\n\
        fi\njq -n --arg status \"$posture_status\" --arg reason \"$posture_reason\" \\\n  --arg scanning \"$secret_scanning\"\
        \ \\\n  --arg protection \"$push_protection\" --arg alerts \"$alerts_status\" \\\n  --argjson count \"$alert_count\"\
        \ \\\n  '{schema_version:\"1\",scanner_family:\"Repository Security Posture\",status:$status,reason:$reason,secret_scanning:$scanning,push_protection:$protection,alerts_status:$alerts,open_alert_count:$count,finding_count:0,observation_count:0}'\
        \ \\\n  > repository-security-posture-status.json\n"
    - name: Retain workflow and platform posture
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: workflow-security-posture
        path: 'zizmor-results.sarif

          repository-security-posture-status.json

          secret-scanning-alert-numbers.txt

          secret-scanning-api.log

          '
        if-no-files-found: error
        retention-days: 7
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'workflow-security-posture') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-3-openssf-scorecard:
    name: OpenSSF Scorecard (Repository Supply Chain)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        persist-credentials: false
    - name: Install verified Scorecard 5.5.0
      run: 'curl --fail --location --retry 3 https://github.com/ossf/scorecard/releases/download/v5.5.0/scorecard_5.5.0_linux_amd64.tar.gz
        -o scorecard.tar.gz

        echo "83b90a05c1540ef1390db1cd5711e5fd04be9c1d8537fb84d39d02092d6a8dff  scorecard.tar.gz" | sha256sum --check

        tar -xzf scorecard.tar.gz scorecard

        '
    - name: Scan external repository at selected commit
      id: scorecard
      continue-on-error: true
      env:
        GITHUB_AUTH_TOKEN: ${{ github.token }}
        ENABLE_SARIF: 'true'
        SOURCE_SHA: ${{ fromJSON(inputs.target).head_sha }}
      run: './scorecard --repo="github.com/$SOURCE_REPOSITORY" --commit="$SOURCE_SHA" --format=json --show-details
        > scorecard-native.json

        python -I scripts/code_analysis/scorecard_report.py'
    - name: Retain Scorecard execution status
      if: always()
      env:
        OUTCOME: ${{ steps.scorecard.outcome }}
      run: "if [[ \"$OUTCOME\" != success ]]; then\n  jq -n '{scanner_family:\"OpenSSF Scorecard\",status:\"OPERATIONAL_FAILURE\"\
        ,reason:\"Native Scorecard execution or source identity validation failed\"}' > scorecard-status.json\n\
        fi"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: openssf-scorecard
        path: 'openssf-scorecard.sarif

          scorecard-status.json

          scorecard-native.json'
        retention-days: 7
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'openssf-scorecard') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-4-complexity:
    name: Radon + Xenon (Code Complexity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: ${{ github.repository }}
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: ${{ runner.temp }}/analysis-tooling/.ci/requirements.txt
    - name: Install tools
      run: python -m pip install --requirement $RUNNER_TEMP/analysis-tooling/.ci/requirements.txt
    - name: "Radon \u2014 cyclomatic complexity report"
      run: 'echo "=== Cyclomatic Complexity (all functions) ==="

        radon cc backend/ -s -a --min A --json > radon-cc.json

        radon cc backend/ -s -a --min B

        echo "=== Maintainability Index ==="

        radon mi backend/ -s --json > radon-mi.json

        radon mi backend/ -s

        '
    - name: "Xenon \u2014 enforce complexity gate"
      run: "# Fail if any module exceeds:\n# --max-average B  (allow avg up to B)\n# --max-modules B  (allow any\
        \ module up to B)\n# --max-absolute C (hard stop at C \u2014 very complex)\nxenon \\\n  --max-average B\
        \ \\\n  --max-modules B \\\n  --max-absolute C \\\n  backend/ 2>&1 | tee xenon-results.txt || true\n"
    - name: Upload Radon reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: radon-reports
        path: 'radon-cc.json

          radon-mi.json

          xenon-results.txt

          '
        retention-days: 7
    needs:
    - identity
    permissions:
      contents: read
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'complexity') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-4-dead-code:
    name: Vulture (Dead Code Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: ${{ github.repository }}
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: ${{ runner.temp }}/analysis-tooling/.ci/requirements.txt
    - name: Install tools
      run: python -m pip install --requirement $RUNNER_TEMP/analysis-tooling/.ci/requirements.txt
    - name: Run Vulture
      run: "vulture backend/ \\\n  --min-confidence 80 \\\n  > vulture-results.txt || true\n# Print human-readable\
        \ summary\nvulture backend/ --min-confidence 80 || true\n"
    - name: Upload Vulture results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: vulture-results
        path: vulture-results.txt
        retention-days: 7
    needs:
    - identity
    permissions:
      contents: read
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'dead-code') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-4-test-coverage:
    name: Coverage.py (Test Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ github.repository }}
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - name: Install dependencies
      run: PYTHONPATH="$RUNNER_TEMP/analysis-tooling" python -m scripts.code_analysis.run_profile python-install
        --source "$GITHUB_WORKSPACE"
    - name: Run pytest with coverage
      env:
        PYTHONPATH: ${{ github.workspace }}/backend
      run: PYTHONPATH="$RUNNER_TEMP/analysis-tooling" python -m scripts.code_analysis.run_profile python-test --source
        "$GITHUB_WORKSPACE"
    - name: Materialize coverage reports after failed or successful tests
      if: always()
      working-directory: backend
      run: 'python -m coverage json -o coverage.json || true

        python -m coverage xml -o coverage.xml || true

        '
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: coverage-reports
        path: 'backend/coverage.xml

          backend/coverage.json

          backend/coverage-status.json

          '
        retention-days: 7
    needs:
    - identity
    permissions:
      contents: read
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'test-coverage') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-7-schemathesis-fuzz:
    name: Schemathesis API Fuzzer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kavach_test
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ github.repository }}
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - name: Install dependencies & Schemathesis
      run: 'PYTHONPATH="$RUNNER_TEMP/analysis-tooling" python -m scripts.code_analysis.run_profile python-install
        --source "$GITHUB_WORKSPACE"

        python -m pip install schemathesis==3.39.16 httpx==0.27.2'
    - name: Run API Fuzzing (Schemathesis)
      id: schemathesis
      run: PYTHONPATH="$RUNNER_TEMP/analysis-tooling" python -m scripts.code_analysis.run_profile api-fuzz --source
        "$GITHUB_WORKSPACE"
    - name: Upload Fuzzing Report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
