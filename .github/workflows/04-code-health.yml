# ============================================================
# Layer 5: Code Health & Technical Debt — Workflow
# Kavach-AgenticSOC Code Intelligence System
# Tools: Radon + Xenon (complexity), Vulture (dead code),
#        Coverage.py (test coverage), CodeScene (hotspots)
# ============================================================

name: Code Health & Technical Debt

on:
  workflow_dispatch:
  # pull_request:
    # branches: [main, Testing]
  # push:
    # branches: [main]
  # schedule:
    # - cron: "0 4 * * 1"    # Monday weekly full health report

  # DORMANT: Activate after Phase 2 testing (see docs/code-analysis/README.md)
permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────
  # Radon — cyclomatic complexity measurement
  # Xenon — enforce complexity thresholds (CI gate)
  # ─────────────────────────────────────────────
  complexity:
    name:  Radon + Xenon (Code Complexity)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .ci/requirements.txt

      - name: Install tools
        run: python -m pip install --requirement .ci/requirements.txt

      - name: Radon — cyclomatic complexity report
        run: |
          echo "=== Cyclomatic Complexity (all functions) ==="
          radon cc backend/ -s -a --min A --json > radon-cc.json
          radon cc backend/ -s -a --min B
          echo "=== Maintainability Index ==="
          radon mi backend/ -s --json > radon-mi.json
          radon mi backend/ -s

      - name: Xenon — enforce complexity gate
        run: |
          # Fail if any module exceeds:
          # --max-average B  (allow avg up to B)
          # --max-modules B  (allow any module up to B)
          # --max-absolute C (hard stop at C — very complex)
          xenon \
            --max-average B \
            --max-modules B \
            --max-absolute C \
            backend/

      - name: Upload Radon reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radon-reports
          path: |
            radon-cc.json
            radon-mi.json

  # ─────────────────────────────────────────────
  # Vulture — Python dead code detection
  # NOTE: output is candidate list, not auto-delete.
  #       All results go through AI triage.
  # ─────────────────────────────────────────────
  dead-code:
    name:  Vulture (Dead Code Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .ci/requirements.txt

      - name: Install tools
        run: python -m pip install --requirement .ci/requirements.txt

      - name: Run Vulture
        run: |
          vulture backend/ \
            --min-confidence 80 \
            > vulture-results.txt || true
          # Print human-readable summary
          vulture backend/ --min-confidence 80 || true

      - name: Upload Vulture results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulture-results
          path: vulture-results.txt

  # ─────────────────────────────────────────────
  # Coverage.py — test coverage + dead code evidence
  # ─────────────────────────────────────────────
  test-coverage:
    name:  Coverage.py (Test Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run pytest with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -q

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: |
            backend/coverage.xml
            backend/coverage.json
