name: Advisory Finding Aggregation

on:
  workflow_dispatch:
    inputs:
      apply_issues:
        description: "Explicitly create advisory GitHub Issues (dry-run when false)"
        required: true
        default: false
        type: boolean
      max_new_issues:
        description: "Safety cap for new HIGH/CRITICAL issues"
        required: true
        default: "25"
        type: string
  # DORMANT: no schedule, push, pull_request, or workflow_run trigger in Phase 1.

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  aggregate:
    name: Normalize, deduplicate, and plan advisory issues
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this fork branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned service dependencies
        run: python -m pip install "click==8.2.1" "ruff==0.12.5"

      - name: Download latest completed scanner artifacts for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scan-artifacts
          for workflow in 01-code-quality.yml 02-security-sast.yml 03-dependency-security.yml 04-code-health.yml; do
            run_id="$(gh run list --workflow "$workflow" --branch "$SCAN_BRANCH" --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -z "$run_id" ]]; then
              echo "::warning::No completed run found for $workflow on $SCAN_BRANCH"
              continue
            fi
            mkdir -p "scan-artifacts/$workflow"
            gh run download "$run_id" --dir "scan-artifacts/$workflow" || echo "::warning::No downloadable artifacts for $workflow run $run_id"
          done

      - name: Normalize and deduplicate by repository file, line, and concept
        run: python scripts/code_analysis/normalizer.py --input-dir scan-artifacts --output-dir normalized --verbose

      - name: Build searchable all-findings dashboard and coverage manifest
        run: >-
          python scripts/code_analysis/dashboard.py
          --findings normalized/deduplicated-findings.json
          --artifacts scan-artifacts
          --output-dir dashboard

      - name: Generate review-only deterministic autofix patch
        run: >-
          python scripts/code_analysis/safe_autofix.py
          --findings normalized/deduplicated-findings.json
          --output-dir autofix

      - name: Read existing advisory issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/issues?state=all&labels=code-analysis&per_page=100" | jq 'flatten | map(select(.pull_request | not))' > existing-issues.json

      - name: Plan issue synchronization (dry-run by default)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(--findings normalized/deduplicated-findings.json --existing-issues existing-issues.json --output issue-sync-plan.json --max-new "${{ inputs.max_new_issues }}")
          if [[ "${{ inputs.apply_issues }}" == "true" ]]; then
            args+=(--apply --repository "$GITHUB_REPOSITORY")
          fi
          python scripts/code_analysis/issue_sync.py "${args[@]}"

      - name: Upload complete advisory analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: advisory-finding-aggregation-${{ github.run_id }}
          path: |
            normalized/
            dashboard/
            autofix/
            issue-sync-plan.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Advisory finding aggregation"
            echo
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Issue apply requested: \`${{ inputs.apply_issues }}\`"
            echo "- Merge blocking: \`disabled\`"
            echo "- Automatic closing: \`disabled\`"
            if [[ -f issue-sync-plan.json ]]; then
              echo
              echo '```json'
              jq 'del(.create)' issue-sync-plan.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
