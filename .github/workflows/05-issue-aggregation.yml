name: Advisory Finding Aggregation

on:
  workflow_dispatch:
    inputs:
      max_new_issues:
        description: "Dry-run cap for proposed HIGH/CRITICAL advisory records"
        required: true
        default: "25"
        type: string
  workflow_run:
    workflows: ["Code Health & Technical Debt"]
    types: [completed]

# Phase 3 monitoring only: the automatic path observes same-repository PR runs and
# cannot create/close Issues, apply fixes, or affect branch protection.

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  aggregate:
    name: Normalize, deduplicate, and plan advisory issues
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this fork branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned service dependencies
        run: python -m pip install "click==8.2.1" "ruff==0.12.5"

      - name: Download latest completed scanner artifacts for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SCAN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          AUTOMATIC_RUN: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scan-artifacts
          for workflow in 01-code-quality.yml 02-security-sast.yml 03-dependency-security.yml 04-code-health.yml; do
            run_id=""
            for attempt in $(seq 1 40); do
              if [[ "$AUTOMATIC_RUN" == "true" ]]; then
                run_id="$(gh run list --workflow "$workflow" --commit "$SCAN_SHA" --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              else
                run_id="$(gh run list --workflow "$workflow" --branch "$SCAN_BRANCH" --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              fi
              [[ -n "$run_id" ]] && break
              sleep 30
            done
            if [[ -z "$run_id" ]]; then
              echo "::error::No completed run found for $workflow at monitored commit $SCAN_SHA"
              exit 1
            fi
            mkdir -p "scan-artifacts/$workflow"
            gh run download "$run_id" --dir "scan-artifacts/$workflow"
          done

      - name: Normalize and deduplicate by repository file, line, and concept
        run: python scripts/code_analysis/normalizer.py --input-dir scan-artifacts --output-dir normalized --verbose

      - name: Build searchable all-findings dashboard and coverage manifest
        run: >-
          python scripts/code_analysis/dashboard.py
          --findings normalized/deduplicated-findings.json
          --artifacts scan-artifacts
          --output-dir dashboard

      - name: Read existing advisory issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/issues?state=all&labels=code-analysis&per_page=100" | jq 'flatten | map(select(.pull_request | not))' > existing-issues.json

      - name: Plan issue synchronization (dry-run by default)
        shell: bash
        run: |
          args=(--findings normalized/deduplicated-findings.json --existing-issues existing-issues.json --output issue-sync-plan.json --max-new "${{ inputs.max_new_issues || '25' }}")
          python scripts/code_analysis/issue_sync.py "${args[@]}"

      - name: Upload complete advisory analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: advisory-finding-aggregation-${{ github.run_id }}
          path: |
            normalized/
            dashboard/
            issue-sync-plan.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Advisory finding aggregation"
            echo
            echo "- Monitored branch: \`${{ github.event.workflow_run.head_branch || github.ref_name }}\`"
            echo "- Monitored commit: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- Issue writes: \`disabled\`"
            echo "- Autofix generation/application: \`disabled\`"
            echo "- Merge blocking: \`disabled\`"
            echo "- Automatic closing: \`disabled\`"
            if [[ -f issue-sync-plan.json ]]; then
              echo
              echo '```json'
              jq 'del(.create)' issue-sync-plan.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
