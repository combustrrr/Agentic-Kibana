name: Code Analysis Dashboard

on:
  workflow_dispatch:
    inputs:
      scan_branch:
        description: "Optional branch whose latest scanner artifacts should be aggregated"
        required: false
        type: string
      scan_sha:
        description: "Optional exact commit SHA for a same-commit manual rebuild"
        required: false
        type: string
  workflow_run:
    workflows: ["Code Health & Technical Debt"]
    types: [completed]

# Phase 3 monitoring only: the automatic path observes same-repository PR runs and
# cannot create/close Issues, apply fixes, or affect branch protection.

permissions:
  actions: read
  checks: write
  contents: read

jobs:
  aggregate:
    name: Build one advisory findings dashboard
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this fork branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned service dependencies
        run: python -m pip install "click==8.2.1" "ruff==0.12.5"

      - name: Download latest completed scanner artifacts for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_BRANCH: ${{ inputs.scan_branch || github.event.workflow_run.head_branch || github.ref_name }}
          SCAN_SHA: ${{ inputs.scan_sha || github.event.workflow_run.head_sha || github.sha }}
          AUTOMATIC_RUN: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scan-artifacts
          for workflow in 01-code-quality.yml 02-security-sast.yml 03-dependency-security.yml 04-code-health.yml; do
            run_id=""
            for attempt in $(seq 1 40); do
              if [[ "$AUTOMATIC_RUN" == "true" ]]; then
                run_id="$(gh run list --workflow "$workflow" --commit "$SCAN_SHA" --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              else
                run_id="$(gh run list --workflow "$workflow" --branch "$SCAN_BRANCH" --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              fi
              [[ -n "$run_id" ]] && break
              sleep 30
            done
            if [[ -z "$run_id" ]]; then
              echo "::error::No completed run found for $workflow at monitored commit $SCAN_SHA"
              exit 1
            fi
            mkdir -p "scan-artifacts/$workflow"
            gh run download "$run_id" --dir "scan-artifacts/$workflow"
          done

      - name: Normalize and deduplicate by repository file, line, and concept
        run: python scripts/code_analysis/normalizer.py --input-dir scan-artifacts --output-dir normalized --verbose

      - name: Validate the required scanner web
        run: >-
          python scripts/code_analysis/channel_status.py
          --manifest config/code-analysis/required-channels.json
          --artifacts scan-artifacts
          --findings normalized/unified-findings.json
          --output channel-status.json

      - name: Recover the immutable accepted baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f config/code-analysis/baseline-index.json ]]; then
            cp config/code-analysis/baseline-index.json baseline-index.json
            exit 0
          fi
          mkdir -p accepted-baseline
          expected_sha="$(jq -r .baseline_commit_sha config/code-analysis/baseline-manifest.json)"
          accepted_sha="$(gh run view 32578162932 --json headSha --jq .headSha)"
          [[ "$accepted_sha" == "$expected_sha" ]] || { echo "::error::Accepted baseline run/commit mismatch"; exit 1; }
          gh run download 32578162932 \
            --name advisory-finding-aggregation-32578162932 \
            --dir accepted-baseline
          python scripts/code_analysis/baseline_builder.py \
            --raw-findings accepted-baseline/normalized/unified-findings.json \
            --manifest config/code-analysis/baseline-manifest.json \
            --channel-manifest config/code-analysis/required-channels.json \
            --repository "$GITHUB_REPOSITORY" \
            --output baseline-index.json

      - name: Recover a lineage-compatible previous monitoring run when available
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          MONITORED_SHA: ${{ inputs.scan_sha || github.event.workflow_run.head_sha || github.sha }}
          MONITORED_BRANCH: ${{ inputs.scan_branch || github.event.workflow_run.head_branch || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous-run
          previous_id="$(gh run list --workflow 05-issue-aggregation.yml --branch "$MONITORED_BRANCH" --status success --limit 20 --json databaseId,headSha | \
            jq -r --arg sha "$MONITORED_SHA" '[.[] | select(.headSha != $sha)] | first | .databaseId // empty')"
          if [[ -n "$previous_id" ]] && git merge-base --is-ancestor "$(gh run view "$previous_id" --json headSha --jq .headSha)" "$MONITORED_SHA"; then
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${previous_id}/artifacts" --jq '[.artifacts[] | select(.name | startswith("advisory-finding-aggregation-"))] | first | .name // empty')"
            if [[ -n "$artifact" ]]; then
              gh run download "$previous_id" --name "$artifact" --dir previous-run
              if [[ -f previous-run/normalized/canonical-findings.json ]]; then
                cp previous-run/normalized/canonical-findings.json previous-run.json
                echo "available=true" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi
          [[ -f previous-run.json ]] || echo "available=false" >> "$GITHUB_OUTPUT"

      - name: Build canonical evidence and compare with history
        env:
          MONITORED_SHA: ${{ inputs.scan_sha || github.event.workflow_run.head_sha || github.sha }}
          MONITORED_BRANCH: ${{ inputs.scan_branch || github.event.workflow_run.head_branch || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          previous=()
          [[ -f previous-run.json ]] && previous=(--previous previous-run.json)
          python scripts/code_analysis/monitoring.py \
            --raw-findings normalized/unified-findings.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$MONITORED_SHA" \
            --branch "$MONITORED_BRANCH" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --channel-manifest config/code-analysis/required-channels.json \
            --channel-status channel-status.json \
            --baseline baseline-index.json \
            "${previous[@]}" \
            --triage config/code-analysis/triage-registry.json \
            --output-dir normalized

      - name: Build searchable attention and backlog dashboard
        run: >-
          python scripts/code_analysis/dashboard.py
          --comparison normalized/comparison.json
          --channel-status channel-status.json
          --output-dir dashboard

      - name: Upload complete advisory analysis
        id: analysis-artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: advisory-finding-aggregation-${{ github.run_id }}
          path: |
            normalized/
            dashboard/
            channel-status.json
            baseline-index.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish one advisory GitHub Check for this commit
        if: always() && steps.analysis-artifact.outputs.artifact-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MONITORED_SHA: ${{ inputs.scan_sha || github.event.workflow_run.head_sha || github.sha }}
          ARTIFACT_URL: ${{ steps.analysis-artifact.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          check_name="Code Analysis Dashboard"
          check_namespace="agentic-soc-static-monitoring-v1"
          check_key="${GITHUB_REPOSITORY}:${MONITORED_SHA}:${check_name}:${check_namespace}"
          external_id="$(printf '%s' "$check_key" | sha256sum | cut -d' ' -f1)"
          mkdir -p dashboard
          if [[ ! -f dashboard/github-summary.md ]]; then
            printf '## Static Analysis Monitoring\n\nA trustworthy comparison could not be produced. Inspect the workflow logs and retained evidence.\n' > dashboard/github-summary.md
          fi
          printf '\n[Download the full searchable dashboard artifact](%s)\n' "$ARTIFACT_URL" >> dashboard/github-summary.md
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${MONITORED_SHA}/check-runs?filter=latest&per_page=100")"
          check_id="$(jq -r --arg name "$check_name" --arg external "$external_id" \
            '[.check_runs[] | select(.name == $name and .external_id == $external)] | first | .id // empty' <<<"$existing")"
          conclusion="failure"
          if [[ -f normalized/comparison.json ]]; then
            conclusion="neutral"
            attention="$(jq '[.findings[] | select(.lifecycle == "NEW" or .lifecycle == "MOVED" or .lifecycle == "INDETERMINATE")] | length' normalized/comparison.json)"
            [[ "$attention" == "0" ]] && conclusion="success"
          fi
          jq -n \
            --arg name "$check_name" \
            --arg sha "$MONITORED_SHA" \
            --arg external "$external_id" \
            --arg url "$ARTIFACT_URL" \
            --arg conclusion "$conclusion" \
            --rawfile summary dashboard/github-summary.md \
            '{name:$name, head_sha:$sha, external_id:$external, status:"completed", conclusion:$conclusion, details_url:$url, output:{title:"Advisory findings are ready", summary:$summary}}' \
            > check-run.json
          if [[ -n "$check_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${check_id}" --input check-run.json >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input check-run.json >/dev/null
          fi

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            if [[ -f dashboard/github-summary.md ]]; then
              cat dashboard/github-summary.md
            else
              echo "## Code Analysis Dashboard"
              echo
              echo "Dashboard generation did not complete. Inspect this run's logs."
            fi
            echo
            echo "- Monitored branch: \`${{ inputs.scan_branch || github.event.workflow_run.head_branch || github.ref_name }}\`"
            echo "- Monitored commit: \`${{ inputs.scan_sha || github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- Full dashboard artifact: ${{ steps.analysis-artifact.outputs.artifact-url }}"
            echo "- Issue writes: \`disabled\`"
            echo "- Autofix generation/application: \`disabled\`"
            echo "- Merge blocking: \`disabled\`"
            echo "- Automatic closing: \`disabled\`"
          } >> "$GITHUB_STEP_SUMMARY"
