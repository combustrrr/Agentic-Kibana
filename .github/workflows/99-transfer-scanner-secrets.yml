name: Transfer scanner credentials to standalone service
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install PyNaCl==1.5.0
      - name: Encrypt only for the dashboard repository public key
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_API_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          box = SealedBox(PublicKey(base64.b64decode('5Q0Em1QKJ650snwscWvMH4DegsP55TVNkcb4OgJB+2M=')))
          values = {}
          for name in ('SONAR_TOKEN', 'SONAR_API_TOKEN', 'SNYK_TOKEN'):
              if not os.environ.get(name):
                  raise SystemExit('Required scanner credential is absent: ' + name)
              values[name] = {'key_id': '3380204578043523366', 'encrypted_value': base64.b64encode(box.encrypt(os.environ[name].encode())).decode()}
          Path('sealed-scanner-credentials.json').write_text(json.dumps(values))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-scanner-credentials
          path: sealed-scanner-credentials.json
          retention-days: 1
