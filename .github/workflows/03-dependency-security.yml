# ============================================================
# Layer 3: Dependency, Supply Chain & Secrets — Workflow
# Agentic SOC external code-analysis service
# Tools: OSV-Scanner, Trivy, Gitleaks, Hadolint, Checkov,
#        GitHub Secret Scanning (native), GitHub Dependency Review
# ============================================================

name: Dependency & Supply Chain Security
run-name: Dependency & Supply Chain Security · ${{ inputs.scan_branch || github.head_ref || github.ref_name }} · ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      scan_sha:
        description: "Exact branch-head commit selected by the manual orchestrator"
        required: false
        type: string
      scan_branch:
        description: "Source branch associated with the selected commit"
        required: false
        type: string
  pull_request:
  push:
    branches: ["**"]
  # schedule:
    # - cron: "0 3 * * *"    # daily dependency check 03:00 UTC

  # Fork-only monitoring: analysis-branch pushes exercise upstream syncs automatically.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Snyk is an optional external source until the fork receives SNYK_TOKEN.
  # It is advisory and scan-only: no monitor, fix, patch, or PR commands run.
  snyk:
    name: Snyk (Optional SCA + Code)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Record unconfigured status
        if: env.SNYK_TOKEN == ''
        shell: bash
        run: |
          printf '%s\n' '{"schema_version":"1","scanner_family":"Snyk","status":"NOT_CONFIGURED","reason":"SNYK_TOKEN is not configured"}' > snyk-status.json

      - name: Install pinned Snyk CLI
        if: env.SNYK_TOKEN != ''
        run: npm install --global snyk@1.1306.4

      - name: Set up Python 3.11 for complete pip dependency trees
        if: env.SNYK_TOKEN != ''
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            .ci/requirements.txt
            backend/requirements.txt
            docs/requirements.txt

      - name: Resolve Python dependency manifests for Snyk SCA
        if: env.SNYK_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .snyk-venv
          .snyk-venv/bin/python -m pip install --disable-pip-version-check \
            -r .ci/requirements.txt -r backend/requirements.txt -r docs/requirements.txt

      - name: Scan open-source dependencies
        id: snyk-sca
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        shell: bash
        run: |
          set +e
          snyk test --all-projects --command=.snyk-venv/bin/python \
            --sarif-file-output=snyk-open-source.sarif 2>&1 | tee snyk-open-source.log
          scan_exit=${PIPESTATUS[0]}
          set -e
          # Snyk can exit zero after testing only some discovered projects. A partial
          # dependency graph is evidence, but it is never a complete SCA result.
          if grep -Eq 'potential projects failed|Missing required packages' snyk-open-source.log; then
            exit 2
          fi
          # Exit 1 means a valid scan found vulnerabilities; this lane is advisory.
          [[ "$scan_exit" -le 1 ]] || exit "$scan_exit"

      - name: Scan source code
        id: snyk-code
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        shell: bash
        run: |
          set +e
          snyk code test --sarif-file-output=snyk-code.sarif 2>&1 | tee snyk-code.log
          scan_exit=${PIPESTATUS[0]}
          set -e
          # Exit 1 means findings. Exit 2+ means unavailable/invalid analysis.
          [[ "$scan_exit" -le 1 ]] || exit "$scan_exit"

      - name: Record configured scan status
        if: always() && env.SNYK_TOKEN != ''
        env:
          SCA_OUTCOME: ${{ steps.snyk-sca.outcome }}
          CODE_OUTCOME: ${{ steps.snyk-code.outcome }}
        shell: bash
        run: |
          status=CONFIGURED_COMPLETE
          reason=""
          if [[ "$SCA_OUTCOME" != success || "$CODE_OUTCOME" != success ]]; then
            status=CONFIGURED_PARTIAL
            reason="One or more Snyk analysis surfaces were unavailable or incomplete; inspect the retained logs"
          fi
          jq -n \
            --arg status "$status" \
            --arg reason "$reason" \
            --arg sca "$SCA_OUTCOME" \
            --arg code "$CODE_OUTCOME" \
            '{schema_version:"1",scanner_family:"Snyk",status:$status,reason:$reason,surfaces:{sca:$sca,code:$code}}' \
            > snyk-status.json

      - name: Upload structured Snyk evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snyk-results
          path: |
            snyk-status.json
            snyk-open-source.sarif
            snyk-code.sarif
            snyk-open-source.log
            snyk-code.log
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # OSV-Scanner — dependency CVE scanning
  # Python (requirements.txt/pyproject.toml)
  # npm (package-lock.json)
  # Offline: YES (downloads vuln DB on run)
  # ─────────────────────────────────────────────
  osv-scanner:
    name:  OSV-Scanner (Dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run OSV-Scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=backend/requirements.txt
            --lockfile=backend/requirements-dev.txt
            --lockfile=webui/package-lock.json
            --format=sarif
            --output=osv-results.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v4
        with:
          sarif_file: osv-results.sarif
          category: "osv-scanner"

      - name: Upload artifact (for normalizer)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osv-results
          path: osv-results.sarif

  # ─────────────────────────────────────────────
  # GitHub Dependency Review (PR only)
  # Blocks PRs that introduce known-vulnerable deps
  # ─────────────────────────────────────────────
  dependency-review:
    name:  Dependency Review (PR Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: GitHub Dependency Review Action
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, AGPL-3.0

  # ─────────────────────────────────────────────
  # Gitleaks — secrets / credentials scanning
  # Scans: full git history + current files
  # Offline: YES (Go binary)
  # ─────────────────────────────────────────────
  gitleaks:
    name:  Gitleaks (Secrets Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    steps:
      - name: Checkout (full history for historical scan)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Validate and normalize Gitleaks output
        shell: bash
        env:
          GITLEAKS_RESULT: ${{ steps.gitleaks.outputs.exit-code }}
        run: |
          if [[ "$GITLEAKS_RESULT" != "0" && "$GITLEAKS_RESULT" != "2" ]]; then
            echo "::error::Gitleaks failed operationally with exit code $GITLEAKS_RESULT"
            exit 1
          fi
          test -s results.sarif
          mv results.sarif gitleaks-results.sarif

      - name: Upload Gitleaks results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif

  # ─────────────────────────────────────────────
  # Trivy — Docker image + filesystem scanning
  # Covers: CVEs in dependencies, IaC misconfigs
  # Offline: YES (downloads vuln DB, can be cached)
  # ─────────────────────────────────────────────
  trivy:
    name:  Trivy (Filesystem & Container Security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Run Trivy (config scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-config.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload SARIF — filesystem
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: "trivy-fs"

      - name: Upload SARIF — config
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v4
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: "trivy-config"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-results
          path: |
            trivy-fs.sarif
            trivy-config.sarif

  # ─────────────────────────────────────────────
  # Hadolint — Dockerfile best practices linting
  # ─────────────────────────────────────────────
  hadolint:
    name:  Hadolint (Dockerfile Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Run Hadolint on all Dockerfiles
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: backend/Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v4
        with:
          sarif_file: hadolint.sarif
          category: "hadolint"

      - name: Upload Hadolint artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hadolint-results
          path: hadolint.sarif

  # ─────────────────────────────────────────────
  # Checkov — IaC security scanning
  # Covers: Docker Compose, GitHub Actions, Kubernetes
  # ─────────────────────────────────────────────
  checkov:
    name:  Checkov (IaC Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install "checkov==3.2.468"

      - name: Run Checkov
        run: |
          checkov \
            --directory . \
            --framework dockerfile,github_actions \
            --output sarif \
            --output-file-path checkov.sarif \
            --soft-fail || true

      - name: Canonicalize Checkov SARIF artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d checkov.sarif ]]; then
            mapfile -d '' sarif_files < <(find checkov.sarif -type f -name '*.sarif' -print0)
            if (( ${#sarif_files[@]} != 1 )); then
              echo "::error::Expected exactly one Checkov SARIF file, found ${#sarif_files[@]}"
              exit 1
            fi
            cp "${sarif_files[0]}" checkov-results.sarif
          elif [[ -f checkov.sarif ]]; then
            cp checkov.sarif checkov-results.sarif
          else
            echo "::error::Checkov did not produce SARIF evidence"
            exit 1
          fi

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v4
        with:
          sarif_file: checkov-results.sarif
          category: "checkov"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkov-results
          path: checkov-results.sarif

  shipping-image-security:
    name: Shipping Images (CVEs + SBOM + License Policy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout selected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Checkout trusted SBOM policy tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .analysis-tooling
          sparse-checkout: scripts/code_analysis/validate_sbom.py
          sparse-checkout-cone-mode: false

      - name: Build exact-commit shipping images
        env:
          SOURCE_SHA: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          common=(--build-arg "TLSOC_BUILD_SHA=$SOURCE_SHA" --build-arg "TLSOC_BUILD_DATE=$build_date")
          docker build "${common[@]}" -t agentic-soc-backend:analysis backend
          docker build "${common[@]}" -t agentic-soc-webui:analysis -f webui/Dockerfile .
          docker image inspect agentic-soc-backend:analysis agentic-soc-webui:analysis \
            > shipping-image-inspect.json

      - name: Scan backend image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: agentic-soc-backend:analysis
          format: sarif
          output: trivy-backend-image.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      - name: Scan web UI image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: agentic-soc-webui:analysis
          format: sarif
          output: trivy-webui-image.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      - name: Generate backend CycloneDX inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: agentic-soc-backend:analysis
          format: cyclonedx
          output: backend.cdx.json

      - name: Generate web UI CycloneDX inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: agentic-soc-webui:analysis
          format: cyclonedx
          output: webui.cdx.json

      - name: Generate backend SPDX inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: agentic-soc-backend:analysis
          format: spdx-json
          output: backend.spdx.json

      - name: Generate web UI SPDX inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: agentic-soc-webui:analysis
          format: spdx-json
          output: webui.spdx.json

      - name: Evaluate SBOM license policy and emit provenance
        env:
          SOURCE_SHA: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python .analysis-tooling/scripts/code_analysis/validate_sbom.py \
            backend.cdx.json webui.cdx.json backend.spdx.json webui.spdx.json \
            --status sbom-policy-status.json --sarif sbom-license-policy.sarif
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" --arg commit "${SOURCE_SHA,,}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --slurpfile images shipping-image-inspect.json \
            '{_type:"https://in-toto.io/Statement/v1",subject:($images[0]|map({name:(.RepoTags[0]//"local-image"),digest:{sha256:(.Id|sub("^sha256:";""))}})),predicateType:"https://slsa.dev/provenance/v1",predicate:{buildDefinition:{buildType:"agentic-soc/github-actions-shipping-images/v1",externalParameters:{repository:$repository,commit:$commit}},runDetails:{builder:{id:"github-actions"},metadata:{invocationId:$run_id}}}}' \
            > shipping-image-provenance.intoto.json
          image_findings="$(jq -s '[.[].runs[]?.results[]?] | length' \
            trivy-backend-image.sarif trivy-webui-image.sarif)"
          jq -n --argjson findings "$image_findings" \
            '{schema_version:"1",scanner_family:"Shipping Image Trivy",status:"COMPLETED_OPTIONAL",reason:"Both exact-commit shipping images were built and scanned",finding_count:$findings,observation_count:$findings}' \
            > shipping-image-trivy-status.json

      - name: Upload backend image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v4
        with:
          sarif_file: trivy-backend-image.sarif
          category: shipping-backend-image

      - name: Upload web UI image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v4
        with:
          sarif_file: trivy-webui-image.sarif
          category: shipping-webui-image

      - name: Upload SBOM license-policy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v4
        with:
          sarif_file: sbom-license-policy.sarif
          category: sbom-license-policy

      - name: Retain image security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shipping-image-security
          path: |
            trivy-backend-image.sarif
            trivy-webui-image.sarif
            sbom-license-policy.sarif
            sbom-policy-status.json
            backend.cdx.json
            webui.cdx.json
            backend.spdx.json
            webui.spdx.json
            shipping-image-inspect.json
            shipping-image-provenance.intoto.json
            shipping-image-trivy-status.json
          if-no-files-found: error

  workflow-security-posture:
    name: Workflow Security (zizmor + Scorecard + Secret Posture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout selected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install and run pinned zizmor
        shell: bash
        run: |
          set -euo pipefail
          pip install "zizmor==1.29.0"
          set +e
          zizmor --format sarif .github > zizmor-results.sarif
          scan_exit=$?
          set -e
          [[ "$scan_exit" -le 1 ]] || exit "$scan_exit"

      - name: Observe GitHub secret-scanning posture
        env:
          GH_TOKEN: ${{ secrets.SECURITY_POSTURE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo_json="$(gh api "repos/${GITHUB_REPOSITORY}")"
          secret_scanning="$(jq -r '.security_and_analysis.secret_scanning.status // "UNAVAILABLE"' <<<"$repo_json")"
          push_protection="$(jq -r '.security_and_analysis.secret_scanning_push_protection.status // "UNAVAILABLE"' <<<"$repo_json")"
          alerts_status=UNAVAILABLE
          alert_count=null
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/secret-scanning/alerts?state=open&per_page=100" \
              --jq '.[].number' > secret-scanning-alert-numbers.txt 2>secret-scanning-api.log; then
            alerts_status=OBSERVED
            alert_count="$(wc -l < secret-scanning-alert-numbers.txt)"
          else
            : > secret-scanning-alert-numbers.txt
          fi
          posture_status=CONFIGURED_COMPLETE
          posture_reason="Secret scanning and push protection enabled; open-alert count observed without secret values"
          if [[ "$secret_scanning" == UNAVAILABLE || "$push_protection" == UNAVAILABLE || "$alerts_status" == UNAVAILABLE ]]; then
            posture_status=CONFIGURED_PARTIAL
            posture_reason="GitHub token cannot observe one or more secret-protection controls; configure a read-only SECURITY_POSTURE_TOKEN"
          elif [[ "$secret_scanning" != enabled || "$push_protection" != enabled ]]; then
            posture_status=CONFIGURED_PARTIAL
            posture_reason="One or more GitHub secret-protection controls require repository-owner activation"
          fi
          jq -n --arg status "$posture_status" --arg reason "$posture_reason" \
            --arg scanning "$secret_scanning" \
            --arg protection "$push_protection" --arg alerts "$alerts_status" \
            --argjson count "$alert_count" \
            '{schema_version:"1",scanner_family:"Repository Security Posture",status:$status,reason:$reason,secret_scanning:$scanning,push_protection:$protection,alerts_status:$alerts,open_alert_count:$count,finding_count:0,observation_count:0}' \
            > repository-security-posture-status.json

      - name: Upload zizmor SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v4
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor-workflow-security

      - name: Retain workflow and platform posture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-security-posture
          path: |
            zizmor-results.sarif
            repository-security-posture-status.json
            secret-scanning-alert-numbers.txt
            secret-scanning-api.log
          if-no-files-found: error

  openssf-scorecard:
    name: OpenSSF Scorecard (Repository Supply Chain)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout selected source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run pinned OpenSSF Scorecard
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: openssf-scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v4
        with:
          sarif_file: openssf-scorecard.sarif
          category: openssf-scorecard

      - name: Retain Scorecard evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openssf-scorecard
          path: openssf-scorecard.sarif
          if-no-files-found: error
