# ============================================================
# Layer 3: Dependency, Supply Chain & Secrets — Workflow
# Kavach-AgenticSOC Code Intelligence System
# Tools: OSV-Scanner, Trivy, Gitleaks, Hadolint, Checkov,
#        GitHub Secret Scanning (native), GitHub Dependency Review
# ============================================================

name: Dependency & Supply Chain Security

on:
  workflow_dispatch:
  pull_request:
    branches: [claude/main, Testing]
  push:
    branches: [feature/static-code-analysis, claude/main, Testing]
  # schedule:
    # - cron: "0 3 * * *"    # daily dependency check 03:00 UTC

  # Fork-only monitoring: analysis-branch pushes exercise upstream syncs automatically.
permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # Snyk is an optional external source until the fork receives SNYK_TOKEN.
  # It is advisory and scan-only: no monitor, fix, patch, or PR commands run.
  snyk:
    name: Snyk (Optional SCA + Code)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record configuration status
        shell: bash
        run: |
          if [[ -z "$SNYK_TOKEN" ]]; then
            printf '%s\n' '{"schema_version":"1","scanner_family":"Snyk","status":"NOT_CONFIGURED","reason":"SNYK_TOKEN is not configured"}' > snyk-status.json
          else
            printf '%s\n' '{"schema_version":"1","scanner_family":"Snyk","status":"CONFIGURED"}' > snyk-status.json
          fi

      - name: Install pinned Snyk CLI
        if: env.SNYK_TOKEN != ''
        run: npm install --global snyk@1.1306.4

      - name: Scan open-source dependencies
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk test --all-projects --sarif-file-output=snyk-open-source.sarif

      - name: Scan source code
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk code test --sarif-file-output=snyk-code.sarif

      - name: Upload structured Snyk evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snyk-results
          path: |
            snyk-status.json
            snyk-open-source.sarif
            snyk-code.sarif
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # OSV-Scanner — dependency CVE scanning
  # Python (requirements.txt/pyproject.toml)
  # npm (package-lock.json)
  # Offline: YES (downloads vuln DB on run)
  # ─────────────────────────────────────────────
  osv-scanner:
    name:  OSV-Scanner (Dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run OSV-Scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=backend/requirements.txt
            --lockfile=backend/requirements-dev.txt
            --lockfile=webui/package-lock.json
            --format=sarif
            --output=osv-results.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          sarif_file: osv-results.sarif
          category: "osv-scanner"

      - name: Upload artifact (for normalizer)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osv-results
          path: osv-results.sarif

  # ─────────────────────────────────────────────
  # GitHub Dependency Review (PR only)
  # Blocks PRs that introduce known-vulnerable deps
  # ─────────────────────────────────────────────
  dependency-review:
    name:  Dependency Review (PR Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: GitHub Dependency Review Action
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, AGPL-3.0

  # ─────────────────────────────────────────────
  # Gitleaks — secrets / credentials scanning
  # Scans: full git history + current files
  # Offline: YES (Go binary)
  # ─────────────────────────────────────────────
  gitleaks:
    name:  Gitleaks (Secrets Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (full history for historical scan)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Validate and normalize Gitleaks output
        shell: bash
        env:
          GITLEAKS_RESULT: ${{ steps.gitleaks.outputs.exit-code }}
        run: |
          if [[ "$GITLEAKS_RESULT" != "0" && "$GITLEAKS_RESULT" != "2" ]]; then
            echo "::error::Gitleaks failed operationally with exit code $GITLEAKS_RESULT"
            exit 1
          fi
          test -s results.sarif
          mv results.sarif gitleaks-results.sarif

      - name: Upload Gitleaks results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif

  # ─────────────────────────────────────────────
  # Trivy — Docker image + filesystem scanning
  # Covers: CVEs in dependencies, IaC misconfigs
  # Offline: YES (downloads vuln DB, can be cached)
  # ─────────────────────────────────────────────
  trivy:
    name:  Trivy (Filesystem & Container Security)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Run Trivy (config scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-config.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload SARIF — filesystem
        uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: "trivy-fs"

      - name: Upload SARIF — config
        uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: "trivy-config"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-results
          path: |
            trivy-fs.sarif
            trivy-config.sarif

  # ─────────────────────────────────────────────
  # Hadolint — Dockerfile best practices linting
  # ─────────────────────────────────────────────
  hadolint:
    name:  Hadolint (Dockerfile Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Hadolint on all Dockerfiles
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: backend/Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          sarif_file: hadolint.sarif
          category: "hadolint"

      - name: Upload Hadolint artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hadolint-results
          path: hadolint.sarif

  # ─────────────────────────────────────────────
  # Checkov — IaC security scanning
  # Covers: Docker Compose, GitHub Actions, Kubernetes
  # ─────────────────────────────────────────────
  checkov:
    name:  Checkov (IaC Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          checkov \
            --directory . \
            --framework dockerfile,github_actions \
            --output sarif \
            --output-file-path checkov.sarif \
            --soft-fail || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          sarif_file: checkov.sarif
          category: "checkov"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkov-results
          path: checkov.sarif
