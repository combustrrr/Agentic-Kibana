# ============================================================
# Layer 2: Security / SAST — GitHub Actions Workflow
# Kavach-AgenticSOC Code Intelligence System
# Tools: CodeQL (Python+JS), Semgrep (OWASP+custom), Bandit
# All findings → SARIF → GitHub Security tab
# ============================================================

name: Security / SAST

on:
  workflow_dispatch:
  pull_request:
    branches: [claude/main]
  push:
    branches: [feature/static-code-analysis]
  # schedule:
    # - cron: "0 2 * * 1"    # weekly full scan — Monday 02:00 UTC

  # Fork-only monitoring: analysis-branch pushes exercise upstream syncs automatically.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ─────────────────────────────────────────────
  # CodeQL — semantic taint/data-flow analysis
  # Covers: Python + JavaScript (TypeScript)
  # Offline: YES — runs entirely on the CI runner
  # ─────────────────────────────────────────────
  codeql:
    name:  CodeQL (Semantic SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Build (Python — no explicit build needed)
        if: matrix.language == 'python'
        run: echo "Python — autobuild skipped, using source"

      - name: Autobuild (TypeScript/React)
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/autobuild@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-${{ matrix.language }}.sarif
          upload: false

      - name: Upload SARIF to GitHub Security tab
        if: success()
        uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          sarif_file: codeql-${{ matrix.language }}.sarif
          category: "codeql-${{ matrix.language }}"

      - name: Upload SARIF artifact (for normalizer)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-${{ matrix.language }}.sarif

  # ─────────────────────────────────────────────
  # Semgrep — fast pattern + custom rules
  # Covers: Python FastAPI, LangGraph, OWASP Top 10
  # Offline: YES (OSS rules bundled, no Semgrep.dev required)
  # ─────────────────────────────────────────────
  semgrep:
    name:  Semgrep (Pattern Analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep==1.80.0 click==8.1.7 python-dateutil==2.9.0.post0

      - name: Validate custom Semgrep rules
        run: semgrep --validate --config=.github/semgrep-rules/

      - name: Run Semgrep (JSON output)
        run: |
          semgrep \
            --config=p/python \
            --config=p/owasp-top-ten \
            --config=p/jwt \
            --config=p/secrets \
            --config=p/fastapi \
            --config=.github/semgrep-rules/ \
            --json \
            --output=semgrep-results.json \
            --severity=ERROR \
            --severity=WARNING \
            backend/ webui/src/ || true

      - name: Normalize Semgrep JSON to SARIF
        run: |
          mkdir -p semgrep-scan-results
          cp semgrep-results.json semgrep-scan-results/
          python scripts/code_analysis/normalizer.py \
            --input-dir semgrep-scan-results \
            --output-dir semgrep-normalized

      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          sarif_file: semgrep-normalized/normalized.sarif
          category: "semgrep"

      - name: Upload SARIF artifact (for normalizer)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: semgrep-normalized/normalized.sarif

      - name: Upload JSON results (for normalizer)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-results
          path: semgrep-results.json
