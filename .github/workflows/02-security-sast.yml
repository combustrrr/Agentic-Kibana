# ============================================================
# Layer 2: Security / SAST — GitHub Actions Workflow
# Kavach-AgenticSOC Code Intelligence System
# Tools: CodeQL (Python+JS), Semgrep (OWASP+custom), Bandit
# All findings → SARIF → GitHub Security tab
# ============================================================

name: Security / SAST

on:
  workflow_dispatch:
  # pull_request:
    # branches: [main, Testing]
  # push:
    # branches: [main, Testing]
  # schedule:
    # - cron: "0 2 * * 1"    # weekly full scan — Monday 02:00 UTC

  # DORMANT: Activate after Phase 2 testing (see docs/code-analysis/README.md)
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ─────────────────────────────────────────────
  # CodeQL — semantic taint/data-flow analysis
  # Covers: Python + JavaScript (TypeScript)
  # Offline: YES — runs entirely on the CI runner
  # ─────────────────────────────────────────────
  codeql:
    name:  CodeQL (Semantic SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a3a30af803 # v6
        with:
          fetch-depth: 2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ed10c74de5fe2c7114560e6a45427e8ab3cf7499 # v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Build (Python — no explicit build needed)
        if: matrix.language == 'python'
        run: echo "Python — autobuild skipped, using source"

      - name: Autobuild (TypeScript/React)
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/autobuild@ed10c74de5fe2c7114560e6a45427e8ab3cf7499 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ed10c74de5fe2c7114560e6a45427e8ab3cf7499 # v3
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-${{ matrix.language }}.sarif
          upload: false

      - name: Upload SARIF to GitHub Security tab
        if: success()
        uses: github/codeql-action/upload-sarif@ed10c74de5fe2c7114560e6a45427e8ab3cf7499 # v3
        with:
          sarif_file: codeql-${{ matrix.language }}.sarif
          category: "codeql-${{ matrix.language }}"

      - name: Upload SARIF artifact (for normalizer)
        if: always()
        uses: actions/upload-artifact@4.5.0
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-${{ matrix.language }}.sarif

  # ─────────────────────────────────────────────
  # Semgrep — fast pattern + custom rules
  # Covers: Python FastAPI, LangGraph, OWASP Top 10
  # Offline: YES (OSS rules bundled, no Semgrep.dev required)
  # ─────────────────────────────────────────────
  semgrep:
    name:  Semgrep (Pattern Analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a3a30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (SARIF + JSON output)
        run: |
          # SARIF output for GitHub Security tab
          semgrep \
            --config=p/python \
            --config=p/owasp-top-ten \
            --config=p/jwt \
            --config=p/secrets \
            --config=p/fastapi \
            --config=.github/semgrep-rules/ \
            --sarif \
            --output=semgrep.sarif \
            --json \
            --output=semgrep-results.json \
            --severity=ERROR \
            --severity=WARNING \
            --exit-zero \
            backend/ webui/src/ || true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ed10c74de5fe2c7114560e6a45427e8ab3cf7499 # v3
        with:
          sarif_file: semgrep.sarif
          category: "semgrep"

      - name: Upload SARIF artifact (for normalizer)
        if: always()
        uses: actions/upload-artifact@4.5.0
        with:
          name: semgrep-sarif
          path: semgrep.sarif

      - name: Upload JSON results (for normalizer)
        if: always()
        uses: actions/upload-artifact@4.5.0
        with:
          name: semgrep-results
          path: semgrep-results.json
