# ============================================================
# Layer 1: Code Quality — GitHub Actions Workflow
# Kavach-AgenticSOC Code Intelligence System
# Tools: Ruff (Python), Pyright (types), ESLint + tsc (TS/React), Bandit
# ============================================================

name: Code Quality

on:
  workflow_dispatch:
  # pull_request:
    # branches: [main, Testing]
  # push:
    # branches: [main, Testing]

  # DORMANT: Activate after Phase 2 testing (see docs/code-analysis/README.md)
permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ─────────────────────────────────────────────
  # Python: Ruff lint + extended security rules
  # ─────────────────────────────────────────────
  python-ruff:
    name:  Ruff (Python Lint + Format)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .ci/requirements.txt

      - name: Install pinned tools
        run: python -m pip install --requirement .ci/requirements.txt

      - name: Ruff lint (default rules — matches existing python-static CI gate)
        run: python -m ruff check backend/app backend/tests

      - name: Ruff lint (extended rules — advisory for baseline phase)
        run: |
          python -m ruff check backend/ \
            --config backend/ruff-analysis.toml \
            --output-format=github \
            --exit-zero \
            || true

      - name: Ruff format check (advisory)
        run: |
          python -m ruff format --check backend/ \
            --config backend/ruff-analysis.toml \
            --exit-zero \
            || true

      - name: Ruff lint (JSON for normalizer)
        if: always()
        run: |
          python -m ruff check backend/ \
            --config backend/ruff-analysis.toml \
            --output-format=json \
            --exit-zero \
            --output ruff-results.json || true

      - name: Upload Ruff results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-results
          path: ruff-results.json

  # ─────────────────────────────────────────────
  # Python: Bandit security scanning
  # NOTE: Bandit is initially advisory (--exit-zero) until a baseline
  #       of existing findings is established and resolved.
  #       Once baseline is clean, remove --exit-zero and --exit-non-zero-on-fix.
  # ─────────────────────────────────────────────
  python-bandit:
    name:  Bandit (Python Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .ci/requirements.txt

      - name: Install tools
        run: python -m pip install --requirement .ci/requirements.txt

      - name: Run Bandit (JSON + SARIF, advisory for baseline)
        run: |
          bandit \
            -r backend/ \
            -c backend/pyproject.toml \
            --format json \
            --output bandit-results.json \
            --exit-zero
          bandit \
            -r backend/ \
            -c backend/pyproject.toml \
            --format sarif \
            --output bandit.sarif \
            --exit-zero || true

      - name: Report HIGH severity findings (informational)
        if: always()
        run: |
          python -c "
              import json, sys
              try:
                  data = json.load(open('bandit-results.json'))
                  highs = [r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH']
                  criticals = [r for r in data.get('results', []) if r.get('issue_severity') == 'CRITICAL']
                  mediums = [r for r in data.get('results', []) if r.get('issue_severity') == 'MEDIUM']
                  lows = [r for r in data.get('results', []) if r.get('issue_severity') == 'LOW']
                  total = len(data.get('results', []))
                  print(f'Bandit findings: {total} total ({len(criticals)} critical, {len(highs)} high, {len(mediums)} medium, {len(lows)} low)')
                  if highs or criticals:
                      print('--- HIGH/CRITICAL findings ---')
                      for h in highs + criticals:
                          print(f'  {h.get(\"test_id\",\"\")} | {h.get(\"filename\",\"\")}:{h.get(\"line_number\",\"\")} | {h.get(\"issue_text\",\"\")[:100]}')
                      print('ACTION: These are advisory. Establish baseline and fix.')
          except Exception as e:
              print(f'Bandit report skipped: {e}')
          "

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          sarif_file: bandit.sarif
          category: "bandit"

      - name: Upload Bandit results artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-results
          path: |
            bandit-results.json
            bandit.sarif

  # ─────────────────────────────────────────────
  # Python: Pyright type checking (advisory — full coverage)
  # ─────────────────────────────────────────────
  python-types:
    name:  Pyright (Python Type Checking)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies + Pyright
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install pyright

      - name: Run Pyright (advisory)
        run: |
          pyright backend/app \
            --outputjson \
            --output pyright-results.json \
            || true

      - name: Upload Pyright results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyright-results
          path: pyright-results.json

  # ─────────────────────────────────────────────
  # TypeScript: ESLint + tsc type checking
  # Uses existing webui eslint.config.js and tsconfig.json
  # ─────────────────────────────────────────────
  typescript-quality:
    name:  ESLint + tsc (TypeScript/React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint lint (github format for PR comments)
        run: npx eslint "src/**/*.{ts,tsx}" --format github || true

      - name: ESLint lint (fail on error — matches existing webui-lint CI gate)
        run: npx eslint "src/**/*.{ts,tsx}"

      - name: Upload ESLint results (for normalizer)
        if: always()
        run: |
          npx eslint "src/**/*.{ts,tsx}" --format json --output-file eslint-results.json || true

      - name: Upload ESLint results artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eslint-results
          path: eslint-results.json
