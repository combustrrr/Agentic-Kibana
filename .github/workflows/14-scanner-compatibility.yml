name: Scanner compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    name: Scanner compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install candidate scanner dependencies without publication credentials
        run: python -m pip install -r .ci/requirements.txt
      - name: Validate generated workflows and channel contracts
        run: |
          python -m unittest scripts.code_analysis.test_hosted scripts.code_analysis.test_extensions scripts.code_analysis.test_portability scripts.code_analysis.test_scanner_access scripts.code_analysis.test_scanner_updates
          python -m scripts.code_analysis.audit_workflows
      - name: Exercise native scanner output compatibility
        run: python -m scripts.code_analysis.scanner_smoke
