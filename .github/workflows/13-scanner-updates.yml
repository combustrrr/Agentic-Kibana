name: Scanner dependency updates
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scanner-dependency-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require repository-scoped maintenance access
        env:
          CONFIGURED: ${{ secrets.SCANNER_UPDATE_TOKEN != '' }}
        run: |
          if [[ "$CONFIGURED" != true ]]; then
            echo 'Scanner updates blocked: configure repository-scoped SCANNER_UPDATE_TOKEN as documented in docs/code-analysis/SCANNER-MAINTENANCE.md. Existing scanner pins remain in use.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Require compatibility protection before automatic merging
        env:
          GH_TOKEN: ${{ secrets.SCANNER_UPDATE_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch=$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["DEFAULT_BRANCH"],safe=""))')
          gh api "repos/$GITHUB_REPOSITORY/branches/$branch/protection/required_status_checks" > required-checks.json
          python -c 'import json; p=json.load(open("required-checks.json")); names=set(p.get("contexts",[])) | {c["context"] for c in p.get("checks",[])}; assert "Scanner compatibility" in names, "Configure the required Scanner compatibility check before enabling automatic scanner merges"'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install trusted generation dependencies
        run: python -m pip install PyYAML==6.0.2
      - name: Propose and reconcile validated scanner updates
        env:
          RENOVATE_TOKEN: ${{ secrets.SCANNER_UPDATE_TOKEN }}
          RENOVATE_CONFIG_FILE: .github/renovate-scanners.cjs
        run: npx --yes --package=renovate@44.72.0 renovate
