server {
  listen 8080;
  server_name _;
  server_tokens off;
  autoindex off;
  root /srv/current;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Cache-Control "no-store" always;
  location = /healthz {
    access_log off;
    default_type text/plain;
    if (!-f /srv/current/index.html) { return 503; }
    return 200 "ok\n";
  }
  location ~ /\. { deny all; }
  location / {
    limit_except GET { deny all; }
    try_files $uri $uri/ =404;
  }
}
