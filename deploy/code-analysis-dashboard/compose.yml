services:
  current-findings-dashboard:
    build: .
    user: "101:101"
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8787:8080"
    volumes:
      - ../../var/code-analysis:/srv:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
