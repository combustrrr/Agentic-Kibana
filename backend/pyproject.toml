[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "tlsoc-agentic-triage"
version = "0.1.13"
description = "Agentic SOC backend (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "playbooks"]
namespaces = false

[tool.setuptools.package-data]
app = [
    "llm/model_registry.json",
    "runbooks/*.md",
    "threat/*.json",
    "threat/*.md",
]
playbooks = ["*.md"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
connectors = {file = ["requirements-connectors.txt"]}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# Note: Extended ruff lint rules (27 rule sets) are in the separate
# backend/ruff-analysis.toml config file, used ONLY by the 01-code-quality.yml
# workflow via --config flag. This keeps the existing python-static CI gate
# (ci.yml) on ruff's default rules (E, F) without disruption.

# ─────────────────────────────────────────────────────────
# Bandit — Python security scanner
# ─────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", ".venv", "__pycache__", "tests/security_canary"]
skips = [
    "B101",  # assert used — OK in non-prod code (see AGENTS.md #3)
    "B107",  # hardcoded password="" default arg — used in notification channels as optional param
    "B110",  # try/except/pass — intentional error-handling pattern in SOC (fail-open, route to NEEDS_HUMAN)
    "B112",  # try/except/continue — intentional error isolation in async pipelines
    "B310",  # request with no cert — internal Redis/httpx calls, not user-facing
    "B311",  # random (non-cryptographic) — used for jitter/id generation, not security
    "B404",  # import subprocess — used only in fuzz harness (tests/security_canary/)
    "B603",  # subprocess without shell — reviewed (fuzzer harness only)
    "B607",  # partial path in subprocess — reviewed (fuzzer harness only)
]
confidence = ["HIGH", "MEDIUM"]

# ─────────────────────────────────────────────────────────
# Coverage.py — test coverage configuration
# ─────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "tests/*",
    "migrations/*",
    ".venv/*",
    "*/conftest.py",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

# ─────────────────────────────────────────────────────────
# mypy — Python type checker (alternative: pyright via pip)
# ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# LangGraph and dynamic typing produce many false positives; keep strict off
strict = false

